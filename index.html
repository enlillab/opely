// ----- Files the developers keep next to the page: version.json (updates) and notify.json (notifications) -----
async function siteJson(name) {
  const response = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
  if (!response.ok) throw new Error(response.status);
  return response.json();
}

// ----- Updates: when we, the developers, change Opely, every student's copy updates -----
// version.json says { "update": a number, "force": true or false, "note": "..." }. The owner raises the
// number from the admin page after an update. A higher number than the one this browser has shows
// an "Update" banner, or, when "force" is on, updates at once.
const UPDATE_KEY = "opely-update";
// The update number this browser has (null on the first visit)
const haveUpdate = () => { try { const v = localStorage.getItem(UPDATE_KEY); return v === null ? null : Number(v) || 0; } catch (error) { return 0; } };
const setUpdate = number => { try { localStorage.setItem(UPDATE_KEY, String(number)); } catch (error) { /* ignored */ } };
let updateChecked = 0;

// Returns "current", "ready" (a banner is shown), "updating" or "offline"
async function checkForUpdate(byHand) {
  updateChecked = Date.now();
  let remote;
  try { remote = await siteJson("version.json"); } catch (error) {
    if (error.message !== "404") return "offline";
    remote = { update: 0 }; // no update sent yet
  }
  const number = Number(remote.update) || 0;
  const have = haveUpdate();
  if (have === null) { setUpdate(number); return "current"; } // the first visit already has the newest Opely
  if (number <= have) return "current";
  if (remote.force || byHand) { await updateNow(number); return "updating"; }
  showUpdateBanner(number, remote.note);
  return "ready";
}

// Throws away this browser's copy of Opely (never the saved lecture files), and loads the newest
async function updateNow(number) {
  setUpdate(number);
  const banner = document.getElementById("updateBanner");
  if (banner) banner.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="update-banner" id="updateBanner" role="status"><span class="grow">${t("Updating Opely…")}</span></div>`);
  try {
    const registration = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (registration) await registration.update();
  } catch (error) { /* the page still reloads */ }
  try {
    const names = await caches.keys();
    await Promise.all(names.filter(name => name.startsWith("opely-shell-")).map(name => caches.delete(name)));
  } catch (error) { /* ignored */ }
  location.reload();
}

function showUpdateBanner(number, note) {
  if (document.getElementById("updateBanner")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="update-banner" id="updateBanner" role="status">
    <span class="grow"><b>${t("A new version of Opely is ready")}</b>${note ? `<br><span class="small">${esc(note)}</span>` : ""}</span>
    <button type="button" class="update-now" id="updateNow">${t("Update")}</button>
    <button type="button" class="update-later" id="updateLater" aria-label="${t("Later")}">${t("Later")}</button>
  </div>`);
  document.getElementById("updateNow").addEventListener("click", () => updateNow(number));
  document.getElementById("updateLater").addEventListener("click", () => document.getElementById("updateBanner").remove());
}

// ----- Notifications: real ones, on the phone or computer, even when Opely is closed -----
// notify.json (saved by the owner from the admin page) has the address of Opely's notifications
// helper on Cloudflare and its public key. Students choose the stages they follow; each stage is
// a "topic" like "cs-stage1". Opely's GitHub job sends the notifications (see cloudflare/SETUP.md).
const NOTIFY_KEY = "opely-notify";
const savedNotify = () => { try { return JSON.parse(localStorage.getItem(NOTIFY_KEY)); } catch (error) { return null; } };
const setSavedNotify = value => { try { value ? localStorage.setItem(NOTIFY_KEY, JSON.stringify(value)) : localStorage.removeItem(NOTIFY_KEY); } catch (error) { /* ignored */ } };

async function notifySetup() {
  try { const setup = await siteJson("notify.json"); return setup && setup.worker && setup.key ? setup : null; } catch (error) { return null; }
}
// "yes", "home-screen" (iPhone or iPad: Opely must be added to the Home Screen first) or "no"
function pushSupport() {
  const apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if ("serviceWorker" in navigator && "PushManager" in window && "Notification" in window && window.isSecureContext) return "yes";
  if (apple && !navigator.standalone) return "home-screen";
  return "no";
}
function keyBytes(text) {
  const plain = atob((text + "===".slice((text.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(plain, c => c.charCodeAt(0));
}
// Turns notifications on (or changes the stages): asks the browser, then tells the helper
async function subscribe(setup, topics) {
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error(t("Notifications are blocked. Allow them for Opely in the browser’s settings."));
  const registration = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let subscription = await registration.pushManager.getSubscription();
  if (!subscription) subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(setup.key) });
  const response = await fetch(setup.worker.replace(/\/+$/, "") + "/subscribe", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ subscription: subscription.toJSON(), topics: topics, lang: lang })
  });
  if (!response.ok) throw new Error(t("Couldn’t reach Opely’s notifications. Try again later."));
  setSavedNotify({ topics: topics, endpoint: subscription.endpoint, lang: lang });
}
async function unsubscribe(setup) {
  const saved = savedNotify();
  setSavedNotify(null);
  try {
    const registration = await navigator.serviceWorker.getRegistration();
    const subscription = registration && await registration.pushManager.getSubscription();
    if (subscription) await subscription.unsubscribe();
    const endpoint = (subscription && subscription.endpoint) || (saved && saved.endpoint);
    if (endpoint && setup) await fetch(setup.worker.replace(/\/+$/, "") + "/unsubscribe", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: endpoint }) });
  } catch (error) { /* turned off in this browser anyway */ }
}

async function showNotifications() {
  const view = viewNumber;
  document.title = t("Notifications") + " | Opely";
  app.innerHTML = `
    <a class="back" href="#settings">${t("Settings")}</a>
    <h1>${t("Notifications")}</h1>
    <div id="notifyBody"><p class="secondary">${t("Loading…")}</p></div>`;
  const setup = await notifySetup();
  if (view !== viewNumber) return;
  const body = document.getElementById("notifyBody");
  const support = pushSupport();
  if (!setup) { body.innerHTML = emptyState("bell", "Notifications aren’t set up yet. The site’s owner turns them on from the admin page."); return; }
  if (support === "home-screen") {
    body.innerHTML = `<div class="card notify-help">${tile("bell", "red")}<p>${t("On iPhone and iPad, notifications work once Opely is on your Home Screen. Tap the Share button, then “Add to Home Screen”, and open Opely from there.")}</p></div>`;
    return;
  }
  if (support === "no") { body.innerHTML = emptyState("bell", "This browser can’t show notifications."); return; }

  const saved = savedNotify();
  const mine = myStage();
  let chosen = new Set(saved ? saved.topics : mine ? [mine.dept + "-" + mine.stage] : []);
  const stageList = dept => stagesOf(dept) || [1, 2, 3, 4].map(n => ({ id: "stage" + n, name: "Stage " + n }));
  const blocked = Notification.permission === "denied";
  body.innerHTML = `
    <ul class="group icons"><li><label class="row switch-row" for="notifyOn">${tile("bell", "red")}
      <span class="grow">${t("Notifications")}<br><span class="secondary small" id="notifyState">${t(saved ? "On" : "Off")}</span></span>
      <input id="notifyOn" type="checkbox" role="switch" ${saved ? "checked" : ""} ${blocked ? "disabled" : ""}><span class="switch" aria-hidden="true"></span>
    </label></li></ul>
    ${blocked ? `<p class="hint-below">${t("Notifications are blocked. Allow them for Opely in the browser’s settings.")}</p>` : ""}
    <h2 class="label">${t("Stages you follow")}</h2>
    ${departments.map(dept => `<div class="card notify-dept">
      <p class="notify-dept-name">${esc(localName(dept))}</p>
      <div class="chips">${stageList(dept).map(stage => { const topic = dept.id + "-" + stage.id;
        return `<button type="button" class="chip-toggle" data-topic="${esc(topic)}" aria-pressed="${chosen.has(topic)}">${esc(stageName(stage))}</button>`; }).join("")}</div>
    </div>`).join("")}
    <p class="hint-below" id="notifyMessage" role="status"></p>`;

  const toggle = document.getElementById("notifyOn");
  const message = document.getElementById("notifyMessage");
  const tell = (text, bad) => { message.textContent = text; message.classList.toggle("error-text", !!bad); };
  const busy = on => { toggle.disabled = on; app.querySelectorAll("[data-topic]").forEach(chip => { chip.disabled = on; }); };
  async function apply() {
    busy(true);
    try {
      if (toggle.checked) {
        if (!chosen.size) { toggle.checked = false; tell(t("Choose at least one stage first."), true); return; }
        tell(t("Saving…"));
        await subscribe(setup, Array.from(chosen));
        tell(t("You’ll get a notification when something new is added."));
      } else {
        await unsubscribe(setup);
        tell(t("Notifications are off."));
      }
      document.getElementById("notifyState").textContent = t(toggle.checked ? "On" : "Off");
    } catch (error) {
      toggle.checked = !!savedNotify();
      tell(error.message || String(error), true);
    } finally {
      busy(false);
      if (Notification.permission === "denied") toggle.disabled = true;
    }
  }
  toggle.addEventListener("change", apply);
  app.querySelectorAll("[data-topic]").forEach(chip => chip.addEventListener("click", () => {
    const topic = chip.dataset.topic;
    if (chosen.has(topic)) chosen.delete(topic); else chosen.add(topic);
    chip.setAttribute("aria-pressed", chosen.has(topic));
    if (toggle.checked) {
      if (!chosen.size) { toggle.checked = false; return apply(); } // no stages left: notifications turn off
      apply();
    }
  }));
}

    appearance: { title: "Appearance", html: `
    <ul class="group icons settings-list">
      ${choiceRow("Theme", "appearance", "indigo", choiceSwitch(APPEARANCE_KEY, [["auto", t("Automatic")], ["light", t("Light")], ["dark", t("Dark")]]))}
      ${choiceRow("Language", "globe", "blue", choiceSwitch(LANGUAGE_KEY, [["auto", t("Automatic")], ["en", "English"], ["ar", "العربية"]]))}
      ${toggleRow("boldText", "Bold text", document.documentElement.classList.contains("bold-text"), "bold", "gray")}
    </ul>
    <p class="hint-below">${t("Automatic follows your device.")}</p>` },

    reading: { title: "Reading", html: `
    ${preview}
    <ul class="group icons settings-list">
      ${stepRow("textSize", "Text size", "textsize", "blue")}
      ${stepRow("size", "Code size", "code", "indigo")}
      ${toggleRow("readWrap", "Wrap long lines", reading.wrap, "wrap", "green")}
      ${toggleRow("readNumbers", "Line numbers", reading.numbers, "numbers", "gray")}
      ${choiceRow("PDF pages", "doc", "red", pairSwitch("pdf", reading.pdf, [["fit", t("Fit width")], ["actual", t("Actual size")]]))}
    </ul>
    <p class="hint-below">${t("The buttons above every text and code file change these too.")}</p>` },

    storage: { title: "Storage", html: `
    <ul class="group icons settings-list">
      <li><span class="row">${tile("tray", "green")}<span class="grow">${t("Saved files")}</span><span id="savedSize" class="end">${t("Loading…")}</span></span></li>
      <li id="clearRow" hidden><button id="clearFiles" class="row danger" type="button">${t("Remove saved files")}</button></li>
    </ul>
    <ul class="group icons settings-list">
      <li><span class="row">${tile("check", "blue")}<span class="grow">${t("Lectures opened")}</span><span class="end">${Object.keys(opened).length}</span></span></li>
      ${Object.keys(opened).length ? `<li><button id="clearProgress" class="row danger" type="button">${t("Reset progress")}</button></li>` : ""}
    </ul>
    <p class="hint-below">${t("Kept in this browser only: files you opened open faster, and offline.")}</p>` }
  };
  const shown = pages[page];
  if (!shown) return showNotFound();
  document.title = t(shown.title) + " | Opely";
  app.innerHTML = `
    ${page ? `<a class="back" href="#settings">${t("Settings")}</a>` : `<a class="back" href="${lastPlace}">${t("Back")}</a>`}
    <h1>${t(shown.title)}</h1>
    ${shown.html}`;
  const on = (id, kind, work) => { const element = document.getElementById(id); if (element) element.addEventListener(kind, work); };

  // The reading preview shows the settings as they are
  const showPreview = () => {
    const now = readerSettings();
    app.querySelectorAll(".reading-preview .reader").forEach(each => {
      const code = each.classList.contains("code");
      each.style.setProperty("--reader-size", ((code ? 13.5 : 16) + (code ? now.size : now.textSize)) + "px");
      each.classList.toggle("wrapped", !code || now.wrap);
      each.classList.toggle("no-numbers", !now.numbers);
    });
  };
  showPreview();
  const changeReading = change => { const now = readerSettings(); change(now); saveReaderSettings(now); };
  app.querySelectorAll("[data-step]").forEach(button => button.addEventListener("click", () => {
    changeReading(now => { now[button.dataset.step] = Math.max(-4, Math.min(8, now[button.dataset.step] + Number(button.dataset.by))); });
    route(true); // redrawn the normal way, so its back link moves into the top bar
  }));
  on("readWrap", "change", event => { changeReading(now => { now.wrap = event.target.checked; }); showPreview(); });
  on("readNumbers", "change", event => { changeReading(now => { now.numbers = event.target.checked; }); showPreview(); });
  // Notifications: one switch. Turning it on follows My stage (or the stages chosen before).
  on("notifySwitch", "change", async event => {
    const toggle = event.target;
    const sayIt = (text, bad) => { const line = document.getElementById("notifySay"); if (line) { line.textContent = t(text); line.classList.toggle("error-text", !!bad); } };
    toggle.disabled = true;
    try {
      const setup = await notifySetup();
      if (!toggle.checked) { await unsubscribe(setup); return route(true); }
      if (!setup) throw new Error("Notifications aren’t set up yet. The site’s owner turns them on from the admin page.");
      const support = pushSupport();
      if (support === "home-screen") throw new Error("On iPhone and iPad, notifications work once Opely is on your Home Screen. Tap the Share button, then “Add to Home Screen”, and open Opely from there.");
      if (support === "no") throw new Error("This browser can’t show notifications.");
      const before = savedNotify();
      const mine = myStage();
      const topics = before ? before.topics : mine ? [mine.dept + "-" + mine.stage] : [];
      if (!topics.length) { location.hash = "#notifications"; return; } // no stage yet: choose them there
      sayIt("Saving…");
      await subscribe(setup, topics);
      route(true); // redrawn the normal way, so its back link moves into the top bar
    } catch (error) {
      toggle.checked = !!savedNotify();
      toggle.disabled = false;
      sayIt(error.message || String(error), true);
    }
  });
  on("boldText", "change", event => {
    try { localStorage.setItem(BOLD_KEY, event.target.checked ? "on" : "off"); } catch (error) { /* storage blocked */ }
    applyBold();
  });
  app.querySelectorAll("[data-pair] button").forEach(button => button.addEventListener("click", () => {
    const name = button.parentElement.dataset.pair;
    if (name === "pdf") changeReading(now => { now.pdf = button.dataset.value; });
    if (name === "start") setOpeningPage(button.dataset.value);
    if (name === "semester") { try { localStorage.setItem(SEMESTER_KEY, button.dataset.value); } catch (error) { /* storage blocked */ } }
    route(true); // redrawn the normal way, so its back link moves into the top bar
  }));

  on("checkUpdates", "click", async () => {
    const state = document.getElementById("updateState");
    state.textContent = t("Checking…");
    const answer = await checkForUpdate(true);
    if (!state.isConnected) return;
    state.textContent = t(answer === "offline" ? "Couldn’t check. Are you online?" : answer === "updating" ? "Updating Opely…" : "Opely is up to date.");
  });
  const forget = document.getElementById("forgetStage");
  if (forget) forget.addEventListener("click", () => {
    if (!forget.dataset.armed) { forget.dataset.armed = "yes"; forget.textContent = t("Tap again to remove"); return; } // two taps, like other removals
    setMyStage(null); route(true); // redrawn the normal way, so its back link moves into the top bar
  });
  on("pickAnother", "click", () => pickMyStage());

  // Choosing in a switch: appearance changes at once, a new language reloads the page in that language
  app.querySelectorAll(".setting button").forEach(button => button.addEventListener("click", () => {
    const key = button.parentElement.dataset.key;
    if (savedChoice(key) === button.dataset.value) return;
    saveChoice(key, button.dataset.value);
    if (key === LANGUAGE_KEY) return location.reload();
    applyAppearance();
    route(true); // redrawn the normal way, so its back link moves into the top bar
  }));

  // Resetting progress needs two taps, like removing files
  const resetButton = document.getElementById("clearProgress");
  if (resetButton) resetButton.addEventListener("click", () => {
    if (!resetButton.dataset.armed) { resetButton.dataset.armed = "yes"; resetButton.textContent = t("Tap again to reset"); return; }
    opened = {};
    try { localStorage.removeItem(OPENED_KEY); localStorage.removeItem(LAST_KEY); } catch (error) { /* ignored */ }
    route(true); // redrawn the normal way, so its back link moves into the top bar
  });

  // How much space the saved PDFs take
  const sizeText = document.getElementById("savedSize");
  const clear = document.getElementById("clearFiles");
  if (!sizeText) return; // only on the Storage page
  if (!window.caches) { sizeText.textContent = t("Saving files isn’t available in this browser."); return; }
  try {
    const cache = await caches.open(FILE_CACHE);
    const saved = await cache.keys();
    let bytes = 0;
    for (const request of saved) bytes += (await (await cache.match(request)).blob()).size;
    if (view !== viewNumber) return; // the student already moved to another page
    const big = bytes >= 1024 * 1024; // under 1 MB, the size is shown in KB
    const size = (bytes / (big ? 1024 * 1024 : 1024)).toLocaleString(locale, { maximumFractionDigits: big ? 1 : 0 }) + (big ? " MB" : " KB");
    const sizeLtr = "\u2066" + size + "\u2069"; // keeps "3 KB" in that order on an Arabic page
    sizeText.textContent = saved.length ? plural(saved.length, "file") + SEP + sizeLtr : t("None");
    document.getElementById("clearRow").hidden = saved.length === 0;
  } catch (error) {
    sizeText.textContent = t("Saving files isn’t available in this browser.");
  }

  // Removing them needs two taps: the first changes the button's text, the second removes
  clear.addEventListener("click", async () => {
    if (!clear.dataset.armed) {
      clear.dataset.armed = "yes";
      clear.textContent = t("Tap again to remove");
      setTimeout(() => {
        if (!clear.isConnected || !clear.dataset.armed) return;
        delete clear.dataset.armed;
        clear.textContent = t("Remove saved files");
      }, 4000);
      return;
    }
    await caches.delete(FILE_CACHE);
    route(true); // redrawn the normal way, so its back link moves into the top bar
  });
}

// ----- Decides which page to draw, based on the part after # in the address -----
// The parts are separated by hyphens: department, stage, course, lecture.
// Examples: #cs   #cs-news   #cs-stage1   #cs-stage1-sem2   #cs-stage1-cs101
//           #cs-stage1-cs101-sources   #cs-stage1-cs101-l1
// One more part opens a PDF: #cs-stage1-cs101-l1-2 is the second file of
// that lecture, and #cs-stage1-cs101-sources-1 is the course's first source.
// How deep a page is: Departments 0, a department 1, a stage 2, and so on.
// Switching semesters, or between lectures and sources, stays at the same depth.
function depthOf(name) {
  if (name === "" || name === "home" || name === "settings") return 0;
  if (name === "about" || name === "search" || name === "notifications") return 1;
  const parts = name.split("-");
  if (/^(sem\d|sources|labs)$/.test(parts[parts.length - 1])) parts.pop();
  if (parts[3] === "archive") return parts.length + 1; // the archive sits deeper than the course
  if (parts[2] === "archived") return 2.5; // a stage's archived courses: between the stage and a course
  return parts.length;
}
const tabOf = name => (name === "settings" || name.startsWith("settings-") || name === "about" || name === "notifications") ? "settings" : "browse";

let shownName = null;       // the page on screen
const scrollPlaces = {};    // where each page was scrolled to, so going back returns there
let lastPlace = "#home";    // where the student was before opening Settings

function route(keepScroll) {
  const name = location.hash.replace("#", "");
  const previous = shownName;
  if (previous !== null && previous !== name) scrollPlaces[previous] = window.scrollY;
  if (name === "search" && previous !== null && previous !== "search") searchFrom = "#" + (previous || "home");
  if (name.split("-")[1] === "news" && previous !== null && previous.split("-")[1] !== "news") newsFrom = "#" + (previous || "home");
  shownName = name;

  // Pages slide in from the side when going deeper, and back out when going up
  let motion = "";
  if (!keepScroll && previous !== null && previous !== name) {
    if (tabOf(previous) !== tabOf(name)) motion = tabOf(name) === "settings" ? "push" : "pop";
    else if (depthOf(name) > depthOf(previous)) motion = "push";
    else if (depthOf(name) < depthOf(previous)) motion = "pop";
    else motion = "fade"; // the same level (a semester, Lectures / Labs): a quick cross-fade
  }
  const scrollTo = keepScroll ? null : motion === "pop" ? (scrollPlaces[name] || 0) : 0;
  const draw = withClass => { drawRoute(name); if (!dockSet) setDock([]); afterDraw(withClass ? motion : "", scrollTo); };
  // Like iPhone: the new page slides over the old one, which moves a little the same way and dims;
  // going back, it slides off again. The top bar and the bottom bar stay put. Browsers without
  // view transitions get a simpler slide of the new page only.
  const swiped = skipMotion;
  skipMotion = false;
  const quiet = !motion || swiped || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!quiet && document.startViewTransition) {
    document.documentElement.dataset.motion = motion;
    const change = document.startViewTransition(() => draw(false));
    change.finished.finally(() => { delete document.documentElement.dataset.motion; });
  } else {
    draw(!swiped);
  }
}
let skipMotion = false; // set by the swipe back: the finger already moved the page

function drawRoute(name) {

  // Tidy up after a PDF that was being viewed
  viewNumber += 1;
  if (fileUrl) { URL.revokeObjectURL(fileUrl); fileUrl = null; }
  if (pageWatcher) { pageWatcher.disconnect(); pageWatcher = null; }

  // The settings button lights up on the Settings page
  // The settings button shows everywhere except in Settings itself
  const tab = tabOf(name);
  document.getElementById("navSettings").hidden = tab === "settings";
  document.getElementById("navSearch").hidden = tab === "settings" || name === "search";
  document.querySelectorAll(".dock-tip, .page-badge").forEach(bubble => bubble.remove());
  dockSet = false; // each page fills the bar with its own buttons; one that doesn't gets none (see route)
  if (name === "search") return showSearch();
  if (tab === "browse") lastPlace = "#" + (name || "home");
  if (name === "settings") return showSettings();
  if (name.startsWith("settings-")) return showSettings(name.slice("settings-".length)); // a part of Settings
  if (name === "about") return showAbout();
  if (name === "notifications") return showNotifications();

  if (catalogText === null) return showLoading();

  if (name === "" || name === "home") return showDepartments();

  const [deptId, stageId, courseId, lectureKey, fileNumber] = name.split("-");
  const dept = departments.find(d => d.id === deptId);
  if (!dept) return showNotFound();
  if (!content[dept.id]) return showLoading();
  const stages = content[dept.id].stages;
  if (stageId === undefined) return showDepartment(dept, stages);
  if (stageId === "news") return showNews(dept, stages, courseId); // #cs-news, or one stage's: #cs-news-stage1

  const stage = stages.find(s => s.id === stageId);
  if (!stage) return showNotFound();
  if (courseId === undefined) return showStage(dept, stage, currentSemester(stage));
  if (courseId === "sem1") return showStage(dept, stage, 1);
  if (courseId === "sem2") return showStage(dept, stage, 2);

  if (courseId === "archived") return showArchivedCourses(dept, stage);
  const course = stage.courses.find(s => s.id === courseId) || archivedCourse(stage, courseId);
  if (!course) return showNotFound();
  if (lectureKey === undefined) return showCourse(dept, stage, course, "lectures");
  if (lectureKey === "archive") return openArchive(dept, stage, course, name.split("-").slice(4));
  if (lectureKey === "labs") {
    const [labKey, labFile] = name.split("-").slice(4);
    if (labKey === undefined) return hasLabs(course) ? showCourse(dept, stage, course, "labs") : showNotFound();
    return openLecture(dept, stage, asLabs(course), labKey, labFile);
  }
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  if (lectureKey === "sources") {
    if (fileNumber === undefined) return showCourse(dept, stage, course, "sources");
    const source = (course.sources || [])[Number(fileNumber) - 1];
    if (!source || !isPdf(source.url)) return showNotFound();
    return showFile(source, base + "-sources", course.title);
  }

  openLecture(dept, stage, course, lectureKey, fileNumber);
}

// A lecture (or a lab, from asLabs), and one of its files
function openLecture(dept, stage, course, lectureKey, fileNumber) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  // A lecture is found by its id. A plain number (an older link) still works.
  let index = course.lectures.findIndex(lecture => lecture.id === lectureKey);
  if (index === -1) index = Number(lectureKey) - 1;
  const lecture = course.lectures[index];
  if (!lecture) return showNotFound();
  if (fileNumber === undefined) return showLecture(dept, stage, course, index + 1);
  if (fileNumber === "earlier") { // a file removed when the lecture was edited, read from the history
    const parts = location.hash.split("-");
    const earlier = (lecture.earlier || [])[Number(parts[parts.length - 1]) - 1];
    return earlier ? showArchivedFile(earlier, base + "-" + lectureKey, lecture.title) : showNotFound();
  }

  const file = (lecture.files || [])[Number(fileNumber) - 1];
  if (!file || !isPdf(file.url)) return showNotFound();
  if (directFile(lecture)) {
    // Opened straight from the course: it counts as opening the lecture, and Back returns to the course
    markOpened(keyOfLecture(dept, stage, course, lecture, index + 1));
    rememberLecture(base + "-" + lectureKey + "-1", lecture, course, index + 1, base.slice(1));
    return showFile(file, base, course.title, filePager(dept, stage, course, index, Number(fileNumber) - 1));
  }
  showFile(file, base + "-" + lectureKey, lecture.title, filePager(dept, stage, course, index, Number(fileNumber) - 1));
}

// Previous and Next between the files of one lecture, like between lectures.
// Before the first file, Previous goes back to the previous lecture; after the last, Next goes on to
// the next lecture. A lecture with just one file opens it straight away, so there the buttons go
// from lecture to lecture.
function filePager(dept, stage, course, index, place) {
  const lecture = course.lectures[index];
  const files = (lecture.files || []).filter(file => file.url);
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const here = base + "-" + (lecture.id || index + 1);
  const position = (lecture.files || []).indexOf(lecture.files[place]);
  const link = (i, words) => {
    const file = lecture.files[i];
    const where = isPdf(file.url) ? `href="${here}-${i + 1}"` : `href="${esc(file.from || file.url)}" ${linkAttrs(file.url)}`;
    return { attrs: where, kicker: t(words), name: file.label };
  };
  let before = null, after = null;
  for (let i = position - 1; i >= 0; i -= 1) if (lecture.files[i].url) { before = link(i, "Previous file"); break; }
  for (let i = position + 1; i < lecture.files.length; i += 1) if (lecture.files[i].url) { after = link(i, "Next file"); break; }
  // Where another lecture opens: its only file straight away (like from the course), or its page
  const lectureAddress = (other, n) => {
    const only = directFile(other);
    return base + "-" + (other.id || n) + (only && isPdf(only.url) ? "-1" : "");
  };
  const nextLecture = course.lectures[index + 1];
  const following = nextLecture ? { attrs: `href="${lectureAddress(nextLecture, index + 2)}"`, kicker: t(course.isLabs ? "Next lab" : "Next lecture"), name: nextLecture.title, end: "skip" } : null;
  const previousLecture = course.lectures[index - 1];
  if (!before && previousLecture) before = { attrs: `href="${lectureAddress(previousLecture, index)}"`, kicker: t(course.isLabs ? "Previous lab" : "Previous lecture"), name: previousLecture.title };
  return { before: before, after: after, following: following,
    count: files.length > 1 ? `<p class="file-count">${t("File {i} of {n}", { i: files.indexOf(lecture.files[place]) + 1, n: files.length })}</p>` : "" };
}

// After a page is drawn: move its back link into the navigation bar,
// watch its big title, scroll, and play the slide.
let titleWatcher = null;
// Once a slide has played, it is cleared, so it never plays again by itself
// (for example when a hidden part of the page is shown again)
app.addEventListener("animationend", event => { if (event.target === app) app.classList.remove("push", "pop", "fade"); });
function afterDraw(motion, scrollTo) {
  const title = document.getElementById("navTitle");
  const link = app.querySelector(":scope > .back");
  const home = !shownName || shownName === "home";
  document.getElementById("navMoves").hidden = home; // Back and Home: on every page but home
  document.getElementById("navBrand").hidden = !home;
  // Back in the bar: the page above, or where the student was before Search or Settings
  dockBack = link ? link.getAttribute("href")
    : shownName === "search" ? searchFrom : shownName === "settings" ? lastPlace : "#home";
  if (link) link.remove();
  const backButton = document.getElementById("navBack");
  backButton.href = dockBack;
  backButton.setAttribute("aria-label", t("Back") + (link ? ": " + link.textContent : ""));
  // A page whose name is its plain big title shows the name in the top bar instead, to save room.
  // (A course or a lecture keeps the name in its main card.)
  const plain = app.querySelector(":scope > h1"); // home too: "Departments" sits next to the logo
  if (plain) plain.classList.add("visually-hidden");
  document.body.classList.toggle("title-nav", !!plain);
  const h1 = plain || app.querySelector("h1");
  title.textContent = h1 ? h1.textContent : "";
  // A long name that doesn't fit in the top bar: its short form instead (Computer Science → CS)
  if (plain && plain.dataset.short && title.scrollWidth > title.clientWidth) title.textContent = plain.dataset.short;
  if (titleWatcher) titleWatcher.disconnect();
  document.body.classList.remove("scrolled-title");
  if (h1 && !plain) {
    titleWatcher = new IntersectionObserver(([entry]) =>
      document.body.classList.toggle("scrolled-title", !entry.isIntersecting && entry.boundingClientRect.top < 60),
      { rootMargin: "-60px 0px 0px 0px" });
    titleWatcher.observe(h1);
  }
  if (scrollTo !== null) window.scrollTo(0, scrollTo);
  if (motion) {
    app.classList.remove("push", "pop", "fade");
    void app.offsetWidth; // restarts the animation
    app.classList.add(motion);
  }
}

// The glass bar fills in once the page scrolls under it
function onScroll() { document.body.classList.toggle("scrolled", window.scrollY > 4); }
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();

// Swipe from the edge of the screen to go back, as in an iPhone app.
// Only when Opely is opened from the home screen: in Safari, Safari does this itself.
const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (standalone) {
  let start = null;
  const rtl = () => document.documentElement.dir === "rtl";
  window.addEventListener("touchstart", event => {
    const touch = event.touches[0];
    const fromEdge = rtl() ? window.innerWidth - touch.clientX : touch.clientX;
    start = fromEdge < 24 && !document.getElementById("navBack").hidden ? { x: touch.clientX, y: touch.clientY } : null;
  }, { passive: true });
  window.addEventListener("touchmove", event => {
    if (!start) return;
    const touch = event.touches[0];
    const dx = (touch.clientX - start.x) * (rtl() ? -1 : 1);
    if (Math.abs(touch.clientY - start.y) > 40) start = null;
    else if (dx > 70) { start = null; location.hash = document.getElementById("navBack").getAttribute("href"); }
  }, { passive: true });
}

// ----- Loading the content -----
// Turns the text of catalog.json into the lists this page uses
function useCatalog(text) {
  const catalog = JSON.parse(text);
  const newFaculties = [];
  const newDepartments = [];
  (catalog.universities || []).forEach(university =>
    (university.faculties || []).forEach(faculty => {
      const list = faculty.departments || [];
      newFaculties.push({ name: localName(faculty), university: university, departments: list });
      list.forEach(dept => newDepartments.push(dept));
    }));
  faculties = newFaculties;
  departments = newDepartments;
  catalogText = text;
}

function useDepartment(id, text) {
  const parsed = JSON.parse(text);
  content[id] = { text: text, stages: parsed.stages || [], announcements: parsed.announcements || [] };
}

// The department named in the address, if any
function currentDepartment() {
  const id = location.hash.replace("#", "").split("-")[0];
  return departments.find(dept => dept.id === id);
}

// The copy of a file saved in this browser, or null
function savedCopy(path) {
  try { return localStorage.getItem(CACHE_PREFIX + path); } catch (error) { return null; }
}

// Shows the saved copy of the current department, if it isn’t open yet.
// Returns true if the department still has to be fetched from the site.
function openSavedDepartment() {
  const dept = currentDepartment();
  if (!dept || content[dept.id]) return false;
  try {
    const text = savedCopy(dept.data);
    if (text) useDepartment(dept.id, text);
  } catch (error) { /* a broken saved copy is ignored */ }
  return true;
}

// Asks the site for the newest copy of one file. When nothing has changed,
// the server only answers “not modified”, which costs it almost nothing.
// Returns true if the file was new.
async function refreshFile(path, shownText, use) {
  const response = await fetch(path, { cache: "no-cache" });
  if (!response.ok) throw new Error("HTTP " + response.status);
  const text = await response.text();
  if (text === shownText) return false;
  use(text);
  try { localStorage.setItem(CACHE_PREFIX + path, text); } catch (error) { /* storage full or blocked */ }
  return true;
}

// Refreshes the catalog and the department being viewed, then redraws if anything changed
async function refresh() {
  try {
    let changed = await refreshFile("catalog.json", catalogText, useCatalog);
    const dept = currentDepartment();
    if (dept) {
      const shown = content[dept.id] ? content[dept.id].text : null;
      if (await refreshFile(dept.data, shown, text => useDepartment(dept.id, text))) changed = true;
    }
    loadFailed = false;
    if (changed) route(true);
  } catch (error) {
    // Only show the error if there is nothing saved to show instead
    const dept = currentDepartment();
    if (catalogText === null || (dept && !content[dept.id])) { loadFailed = true; route(true); }
  }
}

window.addEventListener("hashchange", () => {
  loadFailed = false;
  const needsFetch = openSavedDepartment(); // the student opened a department for the first time
  route();
  if (needsFetch) refresh();
});
// Check again whenever the student comes back to the tab
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// The light/dark button in the top bar: Settings, if it is open, shows the new choice
document.addEventListener("opely-appearance", () => { if (location.hash.startsWith("#settings")) route(true); });

// Updates: checked at the start, when the student comes back to Opely, and every half hour
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - updateChecked > 10 * 60 * 1000) checkForUpdate(false); });
setInterval(() => { if (!document.hidden) checkForUpdate(false); }, 30 * 60 * 1000);
setTimeout(() => checkForUpdate(false), 1500);
// Notifications follow the language: after changing it, the helper is told (no question is asked again)
setTimeout(() => {
  const saved = savedNotify();
  if (saved && saved.lang !== lang && pushSupport() === "yes" && Notification.permission === "granted") {
    notifySetup().then(setup => setup && subscribe(setup, saved.topics)).catch(() => { /* tried again next time */ });
  }
}, 3000);

// Offline: the helper in sw.js keeps a copy of Opely, so it opens with no internet
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* Opely still works, just not offline */ });
}

// Swipe from the edge to go back (from the right edge in Arabic). Opened from the Home Screen, a phone
// has no back gesture of its own; in a browser, the browser's own swipe already goes back.
(() => {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!standalone && !window.OPELY_SWIPE) return;
  const rtl = () => document.documentElement.dir === "rtl";
  let startX = null, startY = 0, moved = 0, sliding = false;
  addEventListener("touchstart", event => {
    startX = null;
    if (event.touches.length !== 1 || !shownName || shownName === "home" || document.querySelector(".sheet-backdrop")) return;
    const x = event.touches[0].clientX;
    if ((rtl() ? innerWidth - x : x) > 24) return; // only from the very edge
    startX = x; startY = event.touches[0].clientY; moved = 0; sliding = false;
  }, { passive: true });
  addEventListener("touchmove", event => {
    if (startX === null) return;
    const touch = event.touches[0];
    const along = (touch.clientX - startX) * (rtl() ? -1 : 1);
    const across = Math.abs(touch.clientY - startY);
    if (!sliding) {
      if (across > 12 && across > along) { startX = null; return; } // scrolling, not going back
      if (along > 10) sliding = true;
    }
    if (sliding) {
      moved = Math.max(0, along);
      app.style.transition = "none";
      app.style.transform = `translateX(${(rtl() ? -1 : 1) * moved}px)`;
      app.style.opacity = String(1 - Math.min(moved / innerWidth, 0.5));
    }
  }, { passive: true });
  addEventListener("touchend", () => {
    if (startX === null) return;
    startX = null;
    const go = sliding && moved > Math.min(100, innerWidth * 0.28);
    app.style.transition = go ? "none" : "transform 0.22s, opacity 0.22s";
    app.style.transform = "";
    app.style.opacity = "";
    setTimeout(() => { app.style.transition = ""; }, 240);
    if (go) { skipMotion = true; location.hash = dockBack || "#home"; }
  });
})();

// Start: show the copies saved in this browser, then ask the site for the newest
try {
  const text = savedCopy("catalog.json");
  if (text) useCatalog(text);
} catch (error) { /* a broken saved copy is ignored */ }
// Opening Opely without an address (from the home screen, or the site's link): My stage, when chosen
if (!location.hash && openingPage() === "mystage" && myStage()) {
  history.replaceState(null, "", "#" + myStage().dept + "-" + myStage().stage);
}
openSavedDepartment();
route();
refresh();
</script>
</body>
</html>
