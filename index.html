<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lectures, slides, and announcements for every department and stage.">
<title>Opely</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Opely">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="lang.js?v=32"></script>
<script src="icons.js?v=32"></script>
<script src="viewer.js?v=32"></script>
</head>
<body>
<!-- The navigation bar: a back button, and the page's name once its big title scrolls away -->
<header class="nav">
  <div class="nav-inner">
    <a id="navBack" class="nav-back" href="#home" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a id="navBrand" class="nav-brand" href="#home" hidden><img src="icon.svg" alt="">Opely</a>
    <span id="navTitle" class="nav-title" aria-hidden="true"></span>
    <a id="navSearch" class="nav-back nav-end" href="#search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></a>
    <a id="navSettings" class="nav-back nav-end" href="#settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<div class="wrap">

  <!-- Every page is drawn inside this element by the script below -->
  <main id="app"></main>
</div>


<script>
/* =====================================================================
   STUDENT PAGE
   The look comes from style.css. The words come through lang.js: text
   wrapped in t("...") is shown in the language of the visitor's device.

   catalog.json lists the departments, grouped by university and faculty.
   Each department has its own content file, for example data/cs.json.
   The admin page (admin.html) updates those files. This page keeps
   copies in the browser so it opens instantly, then asks the site
   whether there are newer copies.
   ===================================================================== */
let faculties = [];      // every faculty in catalog.json, each with its departments
let departments = [];    // every department, as one flat list
let catalogText = null;  // the text of catalog.json being shown (null = not loaded yet)
const content = {};      // department id -> { text, stages, announcements }
let loadFailed = false;
const CACHE_PREFIX = "opely:";
const FILE_CACHE = "opely-files"; // where downloaded PDFs are kept in this browser
let viewNumber = 0;       // goes up each time a page is drawn, so slow work for an old page can stop
let fileUrl = null;       // the address of the PDF being viewed, for its Download button
let pageWatcher = null;   // notices which PDF pages are near the screen

const app = document.getElementById("app");
const VERSION = "1.0";
translatePage(); // the few words written in the HTML above
document.getElementById("navSettings").setAttribute("aria-label", t("Settings"));
document.getElementById("navSearch").setAttribute("aria-label", t("Search"));

// Makes text safe to place inside HTML
function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Files stored in the repository download; outside links open in a new tab
function linkAttrs(url) {
  // Outside links and plain-text files open in a new tab; other files download
  return /^https?:/.test(url) || /\.txt$/i.test(url) ? 'target="_blank" rel="noopener"' : "download";
}

// A file stored in the site that Opely can show inside the page (PDF, text, code, notebook, picture).
// It is saved in the browser too. See viewer.js.
function isPdf(url) {
  return canView(url);
}

// One row in a list of files. `viewer` is the address of the in-page viewer for this file.
function fileRow(file, viewer) {
  const [shape, color] = fileKind(file.url);
  if (!file.url) {
    return `<li><span class="row">${tile(shape, "gray")}<span class="grow secondary">${esc(file.label)}</span><span class="end">${t("Not added yet")}</span></span></li>`;
  }
  if (isPdf(file.url)) {
    return `<li><a class="row" href="${viewer}" data-saved="${esc(file.url)}">${tile(shape, color)}<span class="grow">${esc(file.label)}</span><span class="end"></span></a></li>`;
  }
  return `<li><a class="row" href="${esc(file.from || file.url)}" ${linkAttrs(file.url)}>${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
}

// Writes “Saved” next to the files that are already stored in this browser
async function markSaved() {
  if (!window.caches) return;
  const cache = await caches.open(FILE_CACHE);
  document.querySelectorAll("[data-saved]").forEach(async row => {
    if (!(await cache.match(row.dataset.saved))) return;
    const label = row.querySelector(".end");
    label.className = "end saved";
    label.innerHTML = icon("check") + t("Saved");
  });
}

// Collects every lecture in the given stages, newest first
function allLectures(stageList) {
  const found = [];
  stageList.forEach(stage => stage.courses.forEach(course =>
    course.lectures.forEach((lecture, i) =>
      found.push({ stage, course, lecture, number: i + 1 }))));
  return found.sort((a, b) => b.lecture.date.localeCompare(a.lecture.date));
}

// The small arrow at the end of a widget
const chevron = () => icon("chevron", "flip chev");

// The wide widget that shows the newest lecture of a department
function latestWidget(dept, stageList) {
  const latest = allLectures(stageList)[0];
  if (!latest) return "";
  return `<a class="widget wide" href="#${dept.id}-${latest.stage.id}-${latest.course.id}-${latest.lecture.id || latest.number}">
    <span class="head"><span class="kicker">${t("Latest")}</span>${chevron()}</span>
    <span class="title">${esc(latest.lecture.title)}</span>
    <span class="meta-row"><span>${esc(latest.course.title)}</span><span>${niceDate(latest.lecture.date)}</span></span>
  </a>`;
}

// ----- Progress: which lectures the student has opened, kept in this browser only -----
const OPENED_KEY = "opely-opened";
let opened = {};
try { opened = JSON.parse(localStorage.getItem(OPENED_KEY)) || {}; } catch (error) { opened = {}; }
const keyOfLecture = (dept, stage, course, lecture, number) => `${dept.id}-${stage.id}-${course.id}-${lecture.id || number}`;
function markOpened(key) {
  opened[key] = Date.now();
  try { localStorage.setItem(OPENED_KEY, JSON.stringify(opened)); } catch (error) { /* storage blocked */ }
}
// How many lectures of a course, a stage, or a whole department have been opened: [opened, total]
function courseProgress(dept, stage, course) {
  const done = course.lectures.filter((lecture, i) => opened[keyOfLecture(dept, stage, course, lecture, i + 1)]).length;
  return [done, course.lectures.length];
}
function stageProgress(dept, stage) {
  return stage.courses.reduce(([d, n], course) => { const [a, b] = courseProgress(dept, stage, course); return [d + a, n + b]; }, [0, 0]);
}
function deptProgress(dept, stages) {
  return stages.reduce(([d, n], stage) => { const [a, b] = stageProgress(dept, stage); return [d + a, n + b]; }, [0, 0]);
}

// A progress ring, like the rings in Mo Focus. `size` is in pixels.
function ring(done, total, size, showText) {
  const part = total ? Math.round(done / total * 100) : 0;
  return `<span class="ring${part === 100 ? " full" : ""}" style="--size:${size}px" role="img" aria-label="${t("{done} of {total} opened", { done: done, total: total })}">
    <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15.9155"/>
      <circle class="bar" cx="18" cy="18" r="15.9155" stroke-dasharray="${part} 100"/></svg>
    ${showText ? `<span class="ring-text" dir="ltr"><b>${done}</b><small>/${total}</small></span>` : ""}
  </span>`;
}
// A thin progress bar
const progressBar = (done, total) => `<span class="progress"><span style="width:${total ? done / total * 100 : 0}%"></span></span>`;

// The last lecture the student opened, kept in this browser only
const LAST_KEY = "opely-last";
function rememberLecture(address, lecture, course, number, courseKey) {
  try {
    localStorage.setItem(LAST_KEY, JSON.stringify({ address: address, title: lecture.title, course: course.title,
      number: number, courseKey: courseKey, total: course.lectures.length, lab: !!course.isLabs }));
  } catch (error) { /* storage blocked */ }
}
function continueWidget() {
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_KEY)); } catch (error) { last = null; }
  if (!last || !last.address) return `<div class="hero static welcome">
    <span class="hero-text">
      <span class="kicker">${t("Welcome")}</span>
      <span class="hero-title">${t("Every lecture, in one place.")}</span>
      <span class="sub">${t("Pick your department to start. Opely remembers where you stopped.")}</span>
    </span>
    <img src="icon.svg" alt="" class="app-icon welcome-icon">
  </div>`;
  const done = Object.keys(opened).filter(key => last.courseKey && key.startsWith(last.courseKey + "-") &&
    (last.lab || !key.startsWith(last.courseKey + "-labs-"))).length; // a course's lab keys are counted with its labs only
  return `<a class="hero" href="${esc(last.address)}">
    <span class="hero-text">
      <span class="kicker">${t("Continue")}</span>
      <span class="hero-title">${esc(last.title)}</span>
      <span class="sub">${esc(last.course)}${last.number ? SEP + t(last.lab ? "Lab {n}" : "Lecture {n}", { n: last.number }) : ""}</span>
      <span class="glow-button">${t("Open")}</span>
    </span>
    ${last.total ? ring(Math.min(done, last.total), last.total, 96, true) : ""}
  </a>`;
}

// The number of lectures in a department, from the copy saved in this browser (null if not saved yet)
function savedProgress(dept) {
  if (content[dept.id]) return deptProgress(dept, content[dept.id].stages);
  try {
    const text = savedCopy(dept.data);
    if (text) return deptProgress(dept, JSON.parse(text).stages || []);
  } catch (error) { /* ignored */ }
  return null;
}

// ----- My stage: the student's own department and stage, kept in this browser -----
const MY_STAGE_KEY = "opely-my-stage";
function myStage() {
  try { return JSON.parse(localStorage.getItem(MY_STAGE_KEY)); } catch (error) { return null; }
}
function setMyStage(value) {
  try { value ? localStorage.setItem(MY_STAGE_KEY, JSON.stringify(value)) : localStorage.removeItem(MY_STAGE_KEY); } catch (error) { /* storage blocked */ }
}
// The department's stages: shown, or from the copy saved in this browser
function stagesOf(dept) {
  if (content[dept.id]) return content[dept.id].stages;
  try { const text = savedCopy(dept.data); if (text) return JSON.parse(text).stages || []; } catch (error) { /* ignored */ }
  return null;
}
// The "My stage" card on the home page
function myStageWidget() {
  const mine = myStage();
  if (!mine) return "";
  const dept = departments.find(d => d.id === mine.dept);
  if (!dept) return "";
  const stages = stagesOf(dept);
  const stage = stages && stages.find(s => s.id === mine.stage);
  const name = stage ? stageName(stage) : t("Stage {n}", { n: mine.stage.replace("stage", "") });
  const [done, total] = stage ? stageProgress(dept, stage) : [0, 0];
  return `<a class="hero my-stage" href="#${dept.id}-${mine.stage}">
    <span class="hero-text">
      <span class="kicker">${t("My stage")}</span>
      <span class="hero-title">${esc(name)}</span>
      <span class="sub">${esc(localName(dept))}${stage ? SEP + plural(stage.courses.length, "course") : ""}</span>
      ${content[dept.id] && upcomingEvents(dept, mine.stage)[0] ? `<span class="sub event-line">${icon("calendar")}${esc(upcomingEvents(dept, mine.stage)[0].title)}${SEP}${timeUntil(upcomingEvents(dept, mine.stage)[0].event).words}</span>` : ""}
    </span>
    ${total ? ring(done, total, 72, true) : tile(dept.icon || "school", dept.color, "big")}
  </a>`;
}

// ----- "New" badges: lectures, labs and announcements added since the student last looked -----
// Opely remembers, in this browser, what it has already shown. The first visit to a department
// shows nothing as new; after that, anything added is new until the student sees it.
const KNOWN_KEY = "opely-known";
function knownStore() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY)) || {}; } catch (error) { return {}; } }
function saveKnown(store) { try { localStorage.setItem(KNOWN_KEY, JSON.stringify(store)); } catch (error) { /* storage full */ } }
const newsKey = item => "news:" + (item.id || item.title + item.date);
// Every key of a department: its lectures, labs and announcements
function itemKeys(dept) {
  const stages = stagesOf(dept);
  if (!stages) return null;
  const keys = [];
  stages.forEach(stage => stage.courses.forEach(course => {
    course.lectures.forEach((lecture, i) => keys.push(keyOfLecture(dept, stage, course, lecture, i + 1)));
    if (hasLabs(course)) { const labs = asLabs(course); labs.lectures.forEach((lab, i) => keys.push(keyOfLecture(dept, stage, labs, lab, i + 1))); }
  }));
  const news = content[dept.id] ? content[dept.id].announcements : [];
  news.forEach(item => keys.push(newsKey(item)));
  return keys;
}
// The keys that are new in a department (an empty set on the first visit)
function newIn(dept) {
  const keys = itemKeys(dept);
  if (!keys) return new Set();
  const store = knownStore();
  if (!store[dept.id]) { store[dept.id] = keys; saveKnown(store); return new Set(); }
  const known = new Set(store[dept.id]);
  return new Set(keys.filter(key => !known.has(key)));
}
function markKnown(dept, keys) {
  if (!keys.length) return;
  const store = knownStore();
  const known = new Set(store[dept.id] || []);
  keys.forEach(key => known.add(key));
  store[dept.id] = [...known];
  saveKnown(store);
}
const newBadge = count => count ? `<span class="new-badge">${count === true ? t("New") : t("{n} new", { n: count })}</span>` : "";
// How many new lectures and labs a course (or a stage) has
function newCount(dept, stage, course, fresh) {
  let n = course.lectures.filter((lecture, i) => fresh.has(keyOfLecture(dept, stage, course, lecture, i + 1))).length;
  if (hasLabs(course)) { const labs = asLabs(course); n += labs.lectures.filter((lab, i) => fresh.has(keyOfLecture(dept, stage, labs, lab, i + 1))).length; }
  return n;
}

// ----- Share a course or a lecture: the phone's share sheet, or the link is copied -----
function shareButton() {
  return `<button id="shareButton" class="mine-pill share-pill" type="button">${icon("upload")}${t("Share")}</button>`;
}
function wireShare(title) {
  const button = document.getElementById("shareButton");
  if (!button) return;
  button.addEventListener("click", async () => {
    const link = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: title, url: link }); } catch (error) { /* closed */ }
      return;
    }
    const copied = typeof copyText === "function" && await copyText(link);
    button.lastChild.textContent = t(copied ? "Link copied" : "Can’t copy here");
    setTimeout(() => { if (button.isConnected) button.lastChild.textContent = t("Share"); }, 2000);
  });
}

// ----- The archive: earlier versions of a course, and lectures, labs and sources that were removed -----
// Archived files are no longer on the site; they are read from the site's history on GitHub
// ("commit" says which saved version still has them). They take no space on the site.
function historyAddress(file) {
  if (!file.commit || !location.hostname.endsWith(".github.io")) return file.url; // on a computer, the file is still in the folder
  const owner = location.hostname.replace(".github.io", "");
  const repo = location.pathname.split("/").filter(Boolean)[0] || "Opely";
  return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + file.commit + "/" + file.url.split("/").map(encodeURIComponent).join("/");
}
// A whole course that was archived (stage.archivedCourses), ready to show like any course.
// Its files are read from the history: each gets "from", the address to read it from.
function archivedCourse(stage, id) {
  const found = (stage.archivedCourses || []).find(course => course.id === id);
  if (!found) return null;
  const from = file => file.commit && file.url ? Object.assign({}, file, { from: historyAddress(file) }) : file;
  const item = lecture => Object.assign({}, lecture, { files: (lecture.files || []).map(from) });
  return Object.assign({}, found, { isArchived: true, lectures: found.lectures.map(item),
    labs: found.labs ? found.labs.map(item) : found.labs, sources: (found.sources || []).map(from) });
}
// The archived courses of a stage
function showArchivedCourses(dept, stage) {
  const base = "#" + dept.id + "-" + stage.id;
  document.title = t("Archived courses") + " | " + stageName(stage);
  const list = (stage.archivedCourses || []).slice().sort((a, b) => a.code.localeCompare(b.code, "en", { numeric: true }));
  const widgets = list.map(course => `<a class="widget course" href="${base}-${course.id}">
      <span class="head"><span class="kicker" dir="ltr">${esc(course.code)}</span>${chevron()}</span>
      <span class="title">${esc(course.title)}</span>
      ${course.instructor ? `<span class="sub">${esc(course.instructor)}</span>` : ""}
      <span class="foot meta-row"><span>${plural(course.lectures.length, "lecture")}</span><span>${t("Archived {date}", { date: niceDate(course.archivedAt) })}</span></span>
    </a>`).join("");
  app.innerHTML = `
    <a class="back" href="${base}">${esc(stageName(stage))}</a>
    <h1>${t("Archived courses")}</h1>
    <p class="lead secondary">${t("Courses that are no longer taught. They stay here to read.")}</p>
    ${widgets ? `<div class="courses">${widgets}</div>` : emptyState("clock", "No archived courses.")}`;
}
const hasArchive = course => !!course.archive && ((course.archive.versions || []).length + (course.archive.removed || []).length) > 0;
// A row of an archived file: opens in Opely when it can, otherwise downloads from the history
function archivedFileRow(file, viewer) {
  const [shape, color] = fileKind(file.url);
  if (/^https?:/.test(file.url)) return `<li><a class="row" href="${esc(file.url)}" target="_blank" rel="noopener">${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
  return isPdf(file.url)
    ? `<li><a class="row" href="${viewer}">${tile(shape, color)}<span class="grow">${esc(file.label)}${file.removedAt ? `<br><span class="secondary small">${t("Removed {date}", { date: niceDate(file.removedAt) })}</span>` : ""}</span></a></li>`
    : `<li><a class="row" href="${esc(historyAddress(file))}" download>${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
}
function archiveRowFor(dept, stage, course) {
  if (!hasArchive(course)) return "";
  const a = course.archive;
  const parts = [(a.versions || []).length ? plural(a.versions.length, "earlier version") : "", (a.removed || []).length ? plural(a.removed.length, "removed item") : ""].filter(Boolean).join(SEP);
  return `<ul class="group icons archive-row"><li><a class="row" href="#${dept.id}-${stage.id}-${course.id}-archive">${tile("clock", "gray")}
    <span class="grow">${t("Archive")}<br><span class="secondary small">${parts}</span></span></a></li></ul>`;
}
// The archive page of a course
function showArchive(dept, stage, course) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const a = course.archive || { versions: [], removed: [] };
  document.title = t("Archive") + " | " + course.title;
  const versions = (a.versions || []).map(version => `
    <a class="widget wide" href="${base}-archive-${version.id}">
      <span class="head"><span class="kicker">${t("Archived {date}", { date: niceDate(version.archivedAt) })}</span>${chevron()}</span>
      <span class="title">${esc(version.name)}</span>
      <span class="sub">${[plural(version.lectures.length, "lecture"), version.labs.length ? plural(version.labs.length, "lab") : "", version.sources.length ? plural(version.sources.length, "source") : ""].filter(Boolean).join(SEP)}</span>
    </a>`).join("");
  const kinds = { lecture: ["doc", "indigo", "Lecture"], lab: ["flask", "green", "Lab"], source: ["book", "gray", "Source"] };
  const removed = (a.removed || []).map(entry => {
    const [shape, color, word] = kinds[entry.kind] || kinds.lecture;
    const title = entry.kind === "source" ? entry.item.label : entry.item.title;
    const href = entry.kind === "source"
      ? (isPdf(entry.item.url) ? `href="${base}-archive-${entry.id}-1"` : `href="${esc(historyAddress(entry.item))}" download`)
      : `href="${base}-archive-${entry.id}"`;
    return `<li><a class="row" ${href}>${tile(shape, color)}<span class="grow">${esc(title)}<br>
      <span class="secondary small">${t(word)}${SEP}${t("Removed {date}", { date: niceDate(entry.removedAt) })}</span></span></a></li>`;
  }).join("");
  app.innerHTML = `
    <a class="back" href="${base}">${esc(course.title)}</a>
    <h1>${t("Archive")}</h1>
    <p class="lead secondary">${esc(course.code)}${SEP}${t("Earlier versions of this course, and lectures that were replaced or removed.")}</p>
    ${versions ? `<h2 class="label">${t("Earlier versions")}</h2><div class="widgets">${versions}</div>` : ""}
    ${removed ? `<h2 class="label">${t("Removed")}</h2><ul class="group icons">${removed}</ul>` : ""}
    ${!versions && !removed ? emptyState("clock", "Nothing in the archive yet.") : ""}`;
}
// An archived version: its lectures, labs and sources, the way the course looked then
function showArchivedVersion(dept, stage, course, version) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id + "-archive-" + version.id;
  document.title = version.name + " | " + course.title;
  const list = (items, word) => items.map((item, i) => `
    <li><a class="row" href="${base}-${item.id || i + 1}"><span class="num">${i + 1}</span>

// #cs-stage1-cs101-archive ...  -<version id>  -<version id>-<lecture id>[-<n>]  -<version id>-sources-<n>
//                                -<removed id>[-<n>]
function openArchive(dept, stage, course, parts) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const a = course.archive || { versions: [], removed: [] };
  const [key, second, third] = parts;
  if (key === undefined) return showArchive(dept, stage, course);
  const version = (a.versions || []).find(v => v.id === key);
  if (version) {
    const vbase = base + "-archive-" + version.id;
    if (second === undefined) return showArchivedVersion(dept, stage, course, version);
    if (second === "sources") { const source = version.sources[Number(third) - 1]; return source ? showArchivedFile(source, vbase, version.name) : showNotFound(); }
    const items = version.lectures.concat(version.labs);
    const item = items.find(other => other.id === second) || version.lectures[Number(second) - 1];
    if (!item) return showNotFound();
    const word = version.labs.includes(item) ? "Lab" : "Lecture";
    if (third === undefined) return showArchivedItem(dept, stage, course, item, vbase, vbase + "-" + second, word);
    if (third === "earlier") { const earlier = (item.earlier || [])[Number(parts[3]) - 1]; return earlier ? showArchivedFile(earlier, vbase + "-" + second, item.title) : showNotFound(); }
    const file = (item.files || [])[Number(third) - 1];
    return file ? showArchivedFile(file, vbase + "-" + second, item.title) : showNotFound();
  }
  const entry = (a.removed || []).find(r => r.id === key);
  if (!entry) return showNotFound();
  if (entry.kind === "source") return showArchivedFile(entry.item, base + "-archive", t("Archive"));
  const here = base + "-archive-" + entry.id;
  if (second === undefined) return showArchivedItem(dept, stage, course, entry.item, base + "-archive", here, entry.kind === "lab" ? "Lab" : "Lecture");
  if (second === "earlier") { const earlier = (entry.item.earlier || [])[Number(third) - 1]; return earlier ? showArchivedFile(earlier, here, entry.item.title) : showNotFound(); }
  const file = (entry.item.files || [])[Number(second) - 1];
  return file ? showArchivedFile(file, here, entry.item.title) : showNotFound();
}

// ----- Search: every course, lecture, lab, file and announcement, in every department -----
let searchFrom = "#home";  // where the student was before opening Search
let lastQuery = "";        // kept, so going back to Search shows the same results
// Lower case, without Arabic marks, with the letters that are often typed differently made the same
function plain(text) {
  return String(text || "").toLowerCase()
    .replace(/[ً-ْٰـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}
// Everything that can be found, from the departments shown or saved in this browser
function searchIndex() {
  const found = [];
  departments.forEach(dept => {
    const stages = stagesOf(dept);
    if (!stages) return;
    stages.forEach(stage => stage.courses.forEach(course => {
      const courseHref = `#${dept.id}-${stage.id}-${course.id}`;
      const where = stageName(stage) + SEP + localName(dept);
      found.push({ kind: "course", title: course.title, sub: course.code + SEP + where, href: courseHref, text: [course.title, course.code, course.instructor].join(" ") });
      const lists = [[course, "lecture"]].concat(hasLabs(course) ? [[asLabs(course), "lab"]] : []);
      lists.forEach(([list, kind]) => list.lectures.forEach((lecture, i) => {
        const here = `#${dept.id}-${stage.id}-${list.id}-${lecture.id || i + 1}`;
        const label = t(kind === "lab" ? "Lab {n}" : "Lecture {n}", { n: i + 1 }) + SEP + course.code + SEP + (dept.short || localName(dept));
        found.push({ kind: kind, title: lecture.title, sub: label, href: here, text: [lecture.title, lecture.summary].join(" ") });
        (lecture.files || []).forEach((file, f) => {
          if (!file.url) return;
          found.push({ kind: "file", title: file.label, sub: label, href: isPdf(file.url) ? here + "-" + (f + 1) : here, url: file.url, text: file.label });
        });
      }));
      (course.sources || []).forEach((source, f) => {
        found.push({ kind: "file", title: source.label, sub: t("Source") + SEP + course.code + SEP + (dept.short || localName(dept)), href: isPdf(source.url) ? courseHref + "-sources-" + (f + 1) : courseHref + "-sources", url: source.url, text: source.label });
      });
    }));
    const news = content[dept.id] ? content[dept.id].announcements : (() => { try { return JSON.parse(savedCopy(dept.data)).announcements || []; } catch (error) { return []; } })();
    news.filter(item => !hasEnded(item)).forEach(item => found.push({ kind: "news", title: item.title, sub: niceDate(item.date) + SEP + localName(dept), href: `#${dept.id}-news`, text: [item.title, item.text].join(" ") }));
  });
  return found;
}
// Marks the words that were searched for
function markWords(text, words) {
  let html = esc(text);
  words.forEach(word => {
    if (!word) return;
    const at = plain(text).indexOf(word);
    if (at === -1 || plain(text).length !== text.length) return; // only when letters line up one to one
    const original = text.slice(at, at + word.length);
    html = html.replace(esc(original), "<mark>" + esc(original) + "</mark>");
  });
  return html;
}
function searchResults(query) {
  const words = plain(query).split(/\s+/).filter(Boolean);
  if (!words.length) return `<p class="hint-below">${t("Search every course, lecture, lab, file and announcement.")}</p>`;
  const groups = { course: [], lecture: [], lab: [], file: [], news: [] };
  searchIndex().forEach(item => {
    const text = plain(item.text);
    if (!words.every(word => text.includes(word))) return;
    const score = plain(item.title).startsWith(words[0]) ? 0 : 1;
    groups[item.kind].push(Object.assign({ score: score }, item));
  });
  const titles = { course: "Courses", lecture: "Lectures", lab: "Labs", file: "Files", news: "Announcements" };
  const shapes = { course: ["book", "blue"], lecture: ["doc", "indigo"], lab: ["flask", "green"], news: ["megaphone", "orange"] };
  const sections = Object.keys(groups).filter(kind => groups[kind].length).map(kind => {
    const rows = groups[kind].sort((a, b) => a.score - b.score).slice(0, 25).map(item => {
      const [shape, color] = kind === "file" ? fileKind(item.url) : shapes[kind];
      return `<li><a class="row" href="${item.href}">${tile(shape, color)}<span class="grow">${markWords(item.title, words)}<br><span class="secondary small">${esc(item.sub)}</span></span></a></li>`;
    }).join("");
    return `<h2 class="label">${t(titles[kind])}</h2><ul class="group icons">${rows}</ul>`;
  }).join("");
  return sections || emptyState("search", "Nothing found. Try other words.");
}
async function showSearch() {
  document.title = t("Search") + " | Opely";
  app.innerHTML = `
    <a class="back" href="${searchFrom}">${t("Back")}</a>
    <h1>${t("Search")}</h1>
    <label class="search-field">${icon("search")}<input id="searchInput" type="search" enterkeyhint="search" autocomplete="off"
      placeholder="${t("Courses, lectures, labs, files")}" value="${esc(lastQuery)}" aria-label="${t("Search")}"></label>
    <div id="searchResults">${searchResults(lastQuery)}</div>`;
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  input.addEventListener("input", () => { lastQuery = input.value; results.innerHTML = searchResults(lastQuery); });
  if (!lastQuery) setTimeout(() => input.focus(), 350);
  // Get every department, so the search covers all of them; the results update when they arrive
  const view = viewNumber;
  await Promise.allSettled(departments.map(dept => refreshFile(dept.data, content[dept.id] ? content[dept.id].text : null, text => useDepartment(dept.id, text))));
  if (view === viewNumber && document.getElementById("searchResults")) results.innerHTML = searchResults(lastQuery);
}

// ----- Save a whole course for offline: every file of its lectures, labs and sources -----
function courseFiles(course) {
  const files = [];
  course.lectures.concat(course.labs || []).forEach(lecture => (lecture.files || []).forEach(file => files.push(file)));
  (course.sources || []).forEach(source => files.push(source));
  return files.filter(file => file.url && !/^https?:/.test(file.url));
}
async function offlineCount(files) {
  if (!window.caches) return 0;
  const cache = await caches.open(FILE_CACHE);
  let saved = 0;
  for (const file of files) if (await cache.match(file.url)) saved += 1;
  return saved;
}
function offlineRow(course) {
  if (!window.caches || !courseFiles(course).length) return "";
  return `<ul class="group icons offline-row"><li><button id="offlineButton" class="row" type="button">
    <span id="offlineTile">${tile("download", "blue")}</span>
    <span class="grow">${t("Save for offline")}<br><span id="offlineState" class="secondary small">${t("Checking…")}</span></span>
  </button></li></ul>`;
}
async function wireOffline(course) {
  const button = document.getElementById("offlineButton");
  if (!button) return;
  const files = courseFiles(course);
  const state = document.getElementById("offlineState");
  const show = saved => {
    const all = saved === files.length;
    state.textContent = all ? t("All {n} files are saved in this browser.", { n: files.length }) : t("{saved} of {n} files saved", { saved: saved, n: files.length });
    document.getElementById("offlineTile").innerHTML = tile(all ? "check" : "download", all ? "green" : "blue");
    button.dataset.all = all ? "yes" : "";
  };
  show(await offlineCount(files));
  button.addEventListener("click", async () => {
    if (button.dataset.busy) return;
    if (button.dataset.all) { // already saved: a second tap removes the copies
      if (!button.dataset.armed) { button.dataset.armed = "yes"; state.textContent = t("Tap again to remove this course’s saved files."); return; }
      delete button.dataset.armed;
      const cache = await caches.open(FILE_CACHE);
      for (const file of files) await cache.delete(file.url);
      show(0); markSaved();
      return;
    }
    button.dataset.busy = "yes";
    let saved = 0, failed = 0;
    for (const file of files) {
      state.textContent = t("Saving {i} of {n}…", { i: saved + failed + 1, n: files.length });
      try { await getFile(file.url); saved += 1; } catch (error) { failed += 1; }
    }
    delete button.dataset.busy;
    show(await offlineCount(files));
    if (failed) state.textContent += SEP + t("{n} couldn’t be saved. Check your connection.", { n: failed });
    markSaved();
  });
}

// Today, as "2026-11-15"
function todayText() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

// Whether an announcement's "remove after" time has passed. A date alone lasts the whole day.
function hasEnded(item) {
  if (!item.until) return false;
  return item.until.length <= 10 ? item.until < todayText() : new Date(item.until) < new Date();
}
// "Nov 20, 2026" or "Nov 20, 2026, 09:00"
function whenText(value) {
  const [day, time] = value.split("T");
  return niceDate(day) + (time ? SEP + new Date(value).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" }) : "");
}

// ----- Countdowns: exams and events from announcements -----
// The upcoming events for a stage (or a whole department), soonest first
function upcomingEvents(dept, stageId) {
  const now = new Date();
  return announcementsFor(dept, stageId)
    .filter(item => item.event && (item.event.length <= 10 ? item.event >= todayText() : new Date(item.event) > now))
    .sort((a, b) => a.event.localeCompare(b.event));
}
// How long until an event: { number, unit } for the big text, and a short sentence
function timeUntil(event) {
  const [day, time] = event.split("T");
  const start = new Date(day + "T00:00");
  const today = new Date(todayText() + "T00:00");
  const days = Math.round((start - today) / 86400000);
  if (days < 0) return { number: "", unit: t("Done"), words: t("Already happened") };
  if (days === 0) {
    if (time) {
      const hours = Math.max(0, Math.round((new Date(event) - new Date()) / 3600000));
      if (hours >= 1) return { number: hours, unit: hours === 1 ? t("hour") : t("hours"), words: t("Today at {time}", { time: new Date(event).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" }) }) };
      return { number: "", unit: t("Starting soon"), words: t("Starting soon") };
    }
    return { number: "", unit: t("Today"), words: t("Today") };
  }
  if (days === 1) return { number: 1, unit: t("day"), words: t("Tomorrow") };
  return { number: days, unit: t("days"), words: t("In {n} days", { n: days }) };
}
// The countdown card: the next event, big, with the others below it
function countdownWidget(dept, stageId) {
  const events = upcomingEvents(dept, stageId);
  if (!events.length) return "";
  const next = events[0];
  const left = timeUntil(next.event);
  return `<a class="hero countdown" href="#${dept.id}-news">
    <span class="hero-text">
      <span class="kicker">${t("Countdown")}</span>
      <span class="hero-title">${esc(next.title)}</span>
      <span class="sub">${whenText(next.event)}${events.length > 1 ? SEP + t("{n} more", { n: events.length - 1 }) : ""}</span>
    </span>
    <span class="countdown-number"><b>${left.number}</b><small>${esc(left.unit)}</small></span>
  </a>`;
}

// ----- Announcements -----
// Newest first. With a stage id, only that stage's own announcements.
function announcementsFor(dept, stageId) {
  return content[dept.id].announcements
    .filter(news => !hasEnded(news)) // past its "remove after" time: no longer shown
    .filter(news => stageId === undefined || news.stage === "all" || news.stage === stageId || (news.stages || []).includes(stageId))
    .sort((a, b) => b.date.localeCompare(a.date));
}

// A full-width widget with the newest announcement. Empty text if there is none.
function newsWidget(dept, list, extraClass) {
  if (list.length === 0) return "";
  const more = list.length > 1 ? `<span>${t("{n} more", { n: list.length - 1 })}</span>` : "";

    <span class="title">${esc(list[0].title)}</span>

}

// ----- A stage’s channel: pick a semester, then see its courses -----
function showStage(dept, stage, semester) {
  const base = "#" + dept.id + "-" + stage.id;
  document.title = stageName(stage) + SEP + t("Semester {n}", { n: semester }) + " | " + localName(dept);

  // The two buttons that switch between semesters
  const segments = [1, 2].map(number => `
    <a class="segment" href="${base}-sem${number}" ${number === semester ? 'aria-current="page"' : ""}>${t("Semester {n}", { n: number })}</a>`).join("");

  // This semester’s courses, in order of course code
  const courses = stage.courses
    .filter(course => course.semester === semester)
    .sort((a, b) => a.code.localeCompare(b.code, "en", { numeric: true }));
  const lectures = courses.reduce((total, course) => total + course.lectures.length, 0);

  const fresh = newIn(dept);
  const courseWidgets = courses.map(course => {
    const dates = course.lectures.map(lecture => lecture.date).sort();
    const status = dates.length
      ? t("Updated {date}", { date: niceDate(dates[dates.length - 1]) })
      : t("No lectures yet");
    return `<a class="widget course" href="${base}-${course.id}">
      <span class="head"><span class="kicker" dir="ltr">${esc(course.code)}</span><span class="head-end">${newBadge(newCount(dept, stage, course, fresh))}${chevron()}</span></span>
      <span class="title">${esc(course.title)}</span>
      ${course.instructor ? `<span class="sub">${esc(course.instructor)}</span>` : ""}
      ${hasLabs(course) ? `<span class="sub">${plural((course.labs || []).length, "lab")}</span>` : ""}
      <span class="foot meta-row"><span>${course.lectures.length ? t("{done} of {total} opened", { done: courseProgress(dept, stage, course)[0], total: course.lectures.length }) : t("No lectures yet")}</span>${dates.length ? `<span>${status}</span>` : ""}</span>
      ${course.lectures.length ? progressBar(...courseProgress(dept, stage, course)) : ""}
    </a>`;
  }).join("");

  app.innerHTML = `
    <a class="back" href="#${dept.id}">${esc(localName(dept))}</a>
    <h1>${esc(stageName(stage))}</h1>
    ${(() => { const mine = myStage(); const is = mine && mine.dept === dept.id && mine.stage === stage.id;
      return `<button id="myStageButton" class="mine-pill" type="button" aria-pressed="${!!is}">${icon(is ? "check" : "plus")}${t(is ? "My stage" : "Make this my stage")}</button>`; })()}
    ${countdownWidget(dept, stage.id)}
    ${newsWidget(dept, announcementsFor(dept, stage.id), "notice")}
    <nav class="segments" aria-label="${t("Semester")}">${segments}</nav>
    ${courses.length
      ? `<p class="count">${plural(courses.length, "course")}${SEP}${plural(lectures, "lecture")}</p>
         <div class="courses">${courseWidgets}</div>`
      : emptyState("book", "No courses yet.")}
    ${(stage.archivedCourses || []).length ? `<ul class="group icons archive-row"><li><a class="row" href="${base}-archived">${tile("clock", "gray")}
      <span class="grow">${t("Archived courses")}<br><span class="secondary small">${plural(stage.archivedCourses.length, "course")}</span></span></a></li></ul>` : ""}`;
  document.getElementById("myStageButton").addEventListener("click", () => {
    const mine = myStage();
    setMyStage(mine && mine.dept === dept.id && mine.stage === stage.id ? null : { dept: dept.id, stage: stage.id });
    showStage(dept, stage, semester);
  });
}

// The big button of a course: the first lecture not opened yet
function nextButton(dept, stage, course, base) {
  const index = course.lectures.findIndex((lecture, i) => !opened[keyOfLecture(dept, stage, course, lecture, i + 1)]);
  if (course.lectures.length === 0) return "";
  if (index === -1) return `<span class="sub done-note">${icon("check")}${t(course.isLabs ? "All labs opened" : "All lectures opened")}</span>`;
  const lecture = course.lectures[index];
  const words = course.isLabs ? (index === 0 ? "Start with Lab {n}" : "Continue with Lab {n}") : (index === 0 ? "Start with Lecture {n}" : "Continue with Lecture {n}");
  return `<a class="glow-button" ${lectureLink(dept, stage, course, lecture, index + 1)}>${t(words, { n: index + 1 })}</a>`;
}

// A course's labs, shaped like its lectures, so labs use the same pages, links and progress.
// Their addresses add "-labs": #cs-stage1-cs101-labs, #cs-stage1-cs101-labs-<lab id>
function asLabs(course) {
  return Object.assign({}, course, { id: course.id + "-labs", lectures: course.labs || [], isLabs: true });
}
const hasLabs = course => !!course.hasLabs || (course.labs || []).length > 0;

// A lecture with just one file, and no recording or summary, opens that file straight away
function directFile(lecture) {
  const files = lecture.files || [];
  return files.length === 1 && files[0].url && !lecture.video && !lecture.summary ? files[0] : null;
}
// Where tapping a lecture goes: its page, or its only file
function lectureLink(dept, stage, course, lecture, number) {
  const here = "#" + dept.id + "-" + stage.id + "-" + course.id + "-" + (lecture.id || number);
  const file = directFile(lecture);
  if (!file) return `href="${here}"`;
  if (isPdf(file.url)) return `href="${here}-1"`;
  return `href="${esc(file.from || file.url)}" ${linkAttrs(file.url)} data-opens="${esc(keyOfLecture(dept, stage, course, lecture, number))}"`;
}
// A file that opens outside the page still counts as opening its lecture
document.addEventListener("click", event => {
  const link = event.target.closest && event.target.closest("[data-opens]");
  if (link) markOpened(link.dataset.opens);
});

// ----- A course: a switch between its lectures and its sources -----
function showCourse(dept, stage, course, section) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const sources = course.sources || [];
  document.title = course.title + " | " + stageName(stage);

  let list;
  if (section === "sources") {
    const rows = sources.map((source, i) => fileRow(source, base + "-sources-" + (i + 1))).join("");
    list = sources.length
      ? `<p class="count">${plural(sources.length, "source")}</p><ul class="group icons">${rows}</ul>`
      : emptyState("book", "No sources yet.");
  } else {
    const shown = section === "labs" ? asLabs(course) : course; // lectures, or labs shaped like lectures
    const fresh = newIn(dept);
    var seenNow = shown.lectures.map((lecture, i) => keyOfLecture(dept, stage, shown, lecture, i + 1));
    const rows = shown.lectures.map((lecture, i) => `
      <li><a class="row" ${lectureLink(dept, stage, shown, lecture, i + 1)}>
        ${opened[keyOfLecture(dept, stage, shown, lecture, i + 1)]
          ? `<span class="num done" aria-label="${t("Opened")}">${icon("check")}</span>`
          : `<span class="num">${i + 1}</span>`}
        <span class="grow">${esc(lecture.title)}<br>
          <span class="secondary small">${niceDate(lecture.date)}</span></span>
        ${newBadge(fresh.has(keyOfLecture(dept, stage, shown, lecture, i + 1)))}
      </a></li>`).join("");
    list = shown.lectures.length
      ? `<p class="count">${plural(shown.lectures.length, section === "labs" ? "lab" : "lecture")}</p><ol class="group icons">${rows}</ol>`
      : emptyState(section === "labs" ? "flask" : "doc", section === "labs" ? "No labs yet." : "No lectures yet.");
  }
  // The ring and the big button follow the part that is open: lectures, or labs
  const leading = section === "labs" ? asLabs(course) : course;
  const leadingBase = "#" + dept.id + "-" + stage.id + "-" + leading.id;

  app.innerHTML = `
    ${course.isArchived
      ? `<a class="back" href="#${dept.id}-${stage.id}-archived">${t("Archived courses")}</a>`
      : `<a class="back" href="#${dept.id}-${stage.id}-sem${course.semester}">${esc(stageName(stage))}${SEP}${t("Semester {n}", { n: course.semester })}</a>`}
    <div class="hero static course-hero">
      <span class="hero-text">
        <span class="kicker" dir="ltr">${esc(course.code)}</span>
        <h1>${esc(course.title)}</h1>
        ${course.instructor ? `<span class="sub">${esc(course.instructor)}</span>` : ""}
        ${shareButton()}
      </span>
      ${leading.lectures.length ? ring(...courseProgress(dept, stage, leading), 80, true) : ""}
      ${nextButton(dept, stage, leading, leadingBase)}
    </div>
    ${course.isArchived ? `<p class="archived-note">${icon("clock")}<span>${t("Archived course{sep}archived {date}. It stays here to read.", { sep: SEP, date: niceDate(course.archivedAt) })}</span></p>` : offlineRow(course)}
    <nav class="segments${hasLabs(course) ? " three" : ""}" aria-label="${t("Course content")}">
      <a class="segment" href="${base}" ${section === "lectures" ? 'aria-current="page"' : ""}>${t("Lectures")}</a>
      ${hasLabs(course) ? `<a class="segment" href="${base}-labs" ${section === "labs" ? 'aria-current="page"' : ""}>${t("Labs")}</a>` : ""}
      <a class="segment" href="${base}-sources" ${section === "sources" ? 'aria-current="page"' : ""}>${t("Sources")}</a>
    </nav>
    ${list}
    ${archiveRowFor(dept, stage, course)}`;
  markSaved();
  wireOffline(course);
  wireShare(course.title);
  if (typeof seenNow !== "undefined") markKnown(dept, seenNow); // shown once as new, then known
}

// ----- A single lecture -----
function showLecture(dept, stage, course, number) {
  const lecture = course.lectures[number - 1];
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  document.title = lecture.title + " | " + course.code;
  markOpened(keyOfLecture(dept, stage, course, lecture, number));
  rememberLecture(base + "-" + (lecture.id || number), lecture, course, number, base.slice(1));

  const recording = lecture.video
    ? `<a class="row" href="${esc(lecture.video)}" target="_blank" rel="noopener">${tile("play", "pink")}<span class="grow">${t("Watch recording")}</span></a>`
    : `<span class="row secondary">${tile("play", "gray")}<span class="grow">${t("No recording yet")}</span></span>`;

  const here = base + "-" + (lecture.id || number);
  const files = (lecture.files || []).map((file, i) => fileRow(file, here + "-" + (i + 1))).join("");

  // Links use the lecture's id, so they keep working when lectures are added
  const before = course.lectures[number - 2];

  const previous = before ? `<a href="${base}-${before.id || number - 1}">${icon("back", "flip")}${t("Previous")}</a>` : `<span></span>`;
  const next = after ? `<a class="next" href="${base}-${after.id || number + 1}">${t("Next")}${icon("chevron", "flip")}</a>` : `<span></span>`;

  app.innerHTML = `
    <a class="back" href="${base}">${esc(course.title)}</a>
    <div class="course-head">
      <span class="pill">${t(course.isLabs ? "Lab {n}" : "Lecture {n}", { n: number })}${SEP}<bdi>${esc(course.code)}</bdi></span>
      <h1>${esc(lecture.title)}</h1>
      <p class="meta-row"><span>${niceDate(lecture.date)}</span></p>
      ${shareButton()}
    </div>
    <h2 class="label">${t("Recording")}</h2>
    <ul class="group icons"><li>${recording}</li></ul>
    ${lecture.summary ? `<h2 class="label">${t("Summary")}</h2><p class="text-block">${esc(lecture.summary)}</p>` : ""}
    <h2 class="label">${t("Files")}</h2>

  markSaved();

// ----- A PDF, shown inside the page -----
// Gets a file: from this browser if it was saved before, otherwise from the
// site, and then it is saved for next time. Returns { blob, saved }.
async function getFile(url) {
  let cache = null;
  try { if (window.caches) cache = await caches.open(FILE_CACHE); } catch (error) { cache = null; }
  if (cache) {
    const saved = await cache.match(url);
    if (saved) return { blob: await saved.blob(), saved: true };
  }
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);
  let saved = false;
  if (cache) {
    try { await cache.put(url, response.clone()); saved = true; } catch (error) { /* storage full */ }
  }
  return { blob: await response.blob(), saved: saved };
}

// Loads the PDF reader (PDF.js, in the lib folder) the first time it is needed
let pdfLibrary = null;
function loadPdfLibrary() {
  if (!pdfLibrary) {
    pdfLibrary = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "lib/pdf.min.js";
      script.onload = () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
        resolve(pdfjsLib);
      };
      script.onerror = () => { pdfLibrary = null; reject(new Error("The PDF reader didn’t load.")); };
      document.head.append(script);
    });
  }
  return pdfLibrary;
}

// The name a downloaded file gets: its label, with the file's own ending
function downloadName(file) {
  const ending = (file.url.split(".").pop() || "").toLowerCase();
  return ending && !file.label.toLowerCase().endsWith("." + ending) ? file.label + "." + ending : file.label;
}

async function showFile(file, backAddress, backLabel) {
  const view = viewNumber;
  document.title = file.label + " | Opely";
  app.innerHTML = `
    <a class="back" href="${backAddress}">${esc(backLabel)}</a>
    <h1>${esc(file.label)}</h1>
    <p id="fileStatus" class="secondary" role="status">${t("Downloading…")}</p>
    <p class="file-actions"><a id="fileDownload" class="button" hidden>${icon("download")}${t("Download")}</a>
      <button id="fileCopy" class="button secondary" type="button" hidden>${t("Copy")}</button></p>
    <div id="pages" class="pages"></div>
    <div id="shown" class="shown"></div>`;
  const status = document.getElementById("fileStatus");
  const type = fileType(file.url) || { kind: "pdf", name: "PDF" };

  try {
    // 1. Get the file and offer it as a download
    const got = await getFile(file.from || file.url);
    if (view !== viewNumber) return; // the student already moved to another page
    fileUrl = URL.createObjectURL(got.blob);
    const download = document.getElementById("fileDownload");
    download.href = fileUrl;
    download.download = downloadName(file);
    download.hidden = false;

    // 2. Text, code, notebooks and pictures are shown by viewer.js
    status.textContent = t("Opening…");
    if (type.kind !== "pdf") {
      const shown = await showInPage(document.getElementById("shown"), got.blob, type, file.label);
      if (view !== viewNumber) return;
      status.textContent = t(type.name) + (shown.lines ? SEP + plural(shown.lines, "line") : "") + (got.saved ? SEP + t("saved in this browser") : "");
      if (shown.text !== null) {
        const copy = document.getElementById("fileCopy");
        copy.hidden = false;
        copy.addEventListener("click", async () => {
          copy.textContent = t(await copyText(shown.text) ? "Copied" : "Can’t copy here");
          setTimeout(() => { if (copy.isConnected) copy.textContent = t("Copy"); }, 2000);
        });
      }
      return;
    }

    // 3. A PDF: show its pages
    const library = await loadPdfLibrary();
    const pdf = await library.getDocument({ data: await got.blob.arrayBuffer() }).promise;
    if (view !== viewNumber) return;
    status.textContent = plural(pdf.numPages, "page") + (got.saved ? SEP + t("saved in this browser") : "");
    await showPages(pdf, view);
  } catch (error) {
    if (view !== viewNumber) return;
    status.textContent = fileUrl
      ? t("Can’t show this file here. You can still download it.")
      : t("Can’t get this file. Check your connection, then reload.");
  }
}

// Makes an empty box for every page, and draws a page only when the student
// scrolls near it. A long file would be slow and heavy if drawn all at once.
async function showPages(pdf, view) {
  const holder = document.getElementById("pages");
  const size = (await pdf.getPage(1)).getViewport({ scale: 1 });
  if (view !== viewNumber) return;

  pageWatcher = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    pageWatcher.unobserve(entry.target);
    drawPage(pdf, entry.target, view);
  }), { rootMargin: "800px 0px" });

  for (let number = 1; number <= pdf.numPages; number += 1) {
    const box = document.createElement("div");
    box.className = "page";
    box.dataset.page = number;
    box.style.aspectRatio = size.width + " / " + size.height;
    holder.append(box);
    pageWatcher.observe(box);
  }
}

async function drawPage(pdf, box, view) {
  const page = await pdf.getPage(Number(box.dataset.page));
  if (view !== viewNumber) return;
  // Draw at the width of the box, a little sharper on high-resolution screens
  const sharpness = Math.min(window.devicePixelRatio || 1, 2);
  const natural = page.getViewport({ scale: 1 });
  const viewport = page.getViewport({ scale: box.clientWidth / natural.width * sharpness });
  const canvas = document.createElement("canvas");
  canvas.dir = "ltr"; // a PDF page is drawn left to right, even on a right-to-left site
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", t("Page {n}", { n: box.dataset.page }));
  box.style.aspectRatio = natural.width + " / " + natural.height;
  box.append(canvas);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
}

// ----- Shown while the content is loading, or if it can’t be loaded -----
// An empty list or page: a large soft icon and a short sentence
function emptyState(shape, message) {
  return `<div class="empty-state"><span class="halo">${icon(shape)}</span><p>${t(message)}</p></div>`;
}

function showEmpty(shape, message) {
  app.innerHTML = `<h1>Opely</h1>${emptyState(shape, message)}`;
}

// While the content loads, grey shapes stand in for it; if it can't load, say so
function showLoading() {
  if (loadFailed) return showEmpty("wifioff", "Can’t load the lectures. Check your connection, then reload.");
  app.innerHTML = `<div class="skeleton" role="status" aria-label="${t("Loading…")}"><div class="short"></div><div></div><div></div><div></div></div>`;
}

// ----- Files the developers keep next to the page: version.json (updates) and notify.json (notifications) -----
async function siteJson(name) {
  const response = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
  if (!response.ok) throw new Error(response.status);
  return response.json();
}

// ----- Updates: when we, the developers, change Opely, every student's copy updates -----
// version.json says { "update": a number, "force": true or false, "note": "..." }. The owner raises the
// number from the admin page after an update. A higher number than the one this browser has shows
// an "Update" banner, or, when "force" is on, updates at once.
const UPDATE_KEY = "opely-update";
// The update number this browser has (null on the first visit)
const haveUpdate = () => { try { const v = localStorage.getItem(UPDATE_KEY); return v === null ? null : Number(v) || 0; } catch (error) { return 0; } };
const setUpdate = number => { try { localStorage.setItem(UPDATE_KEY, String(number)); } catch (error) { /* ignored */ } };
let updateChecked = 0;

// Returns "current", "ready" (a banner is shown), "updating" or "offline"
async function checkForUpdate(byHand) {
  updateChecked = Date.now();
  let remote;
  try { remote = await siteJson("version.json"); } catch (error) {
    if (error.message !== "404") return "offline";
    remote = { update: 0 }; // no update sent yet
  }
  const number = Number(remote.update) || 0;
  const have = haveUpdate();
  if (have === null) { setUpdate(number); return "current"; } // the first visit already has the newest Opely
  if (number <= have) return "current";
  if (remote.force || byHand) { await updateNow(number); return "updating"; }
  showUpdateBanner(number, remote.note);
  return "ready";
}

// Throws away this browser's copy of Opely (never the saved lecture files), and loads the newest
async function updateNow(number) {
  setUpdate(number);
  const banner = document.getElementById("updateBanner");
  if (banner) banner.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="update-banner" id="updateBanner" role="status"><span class="grow">${t("Updating Opely…")}</span></div>`);
  try {
    const registration = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (registration) await registration.update();
  } catch (error) { /* the page still reloads */ }
  try {
    const names = await caches.keys();
    await Promise.all(names.filter(name => name.startsWith("opely-shell-")).map(name => caches.delete(name)));
  } catch (error) { /* ignored */ }
  location.reload();
}

function showUpdateBanner(number, note) {
  if (document.getElementById("updateBanner")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="update-banner" id="updateBanner" role="status">
    <span class="grow"><b>${t("A new version of Opely is ready")}</b>${note ? `<br><span class="small">${esc(note)}</span>` : ""}</span>
    <button type="button" class="update-now" id="updateNow">${t("Update")}</button>
    <button type="button" class="update-later" id="updateLater" aria-label="${t("Later")}">${t("Later")}</button>
  </div>`);
  document.getElementById("updateNow").addEventListener("click", () => updateNow(number));
  document.getElementById("updateLater").addEventListener("click", () => document.getElementById("updateBanner").remove());
}

// ----- Notifications: real ones, on the phone or computer, even when Opely is closed -----
// notify.json (saved by the owner from the admin page) has the address of Opely's notifications
// helper on Cloudflare and its public key. Students choose the stages they follow; each stage is
// a "topic" like "cs-stage1". Opely's GitHub job sends the notifications (see cloudflare/SETUP.md).
const NOTIFY_KEY = "opely-notify";
const savedNotify = () => { try { return JSON.parse(localStorage.getItem(NOTIFY_KEY)); } catch (error) { return null; } };
const setSavedNotify = value => { try { value ? localStorage.setItem(NOTIFY_KEY, JSON.stringify(value)) : localStorage.removeItem(NOTIFY_KEY); } catch (error) { /* ignored */ } };

async function notifySetup() {
  try { const setup = await siteJson("notify.json"); return setup && setup.worker && setup.key ? setup : null; } catch (error) { return null; }
}
// "yes", "home-screen" (iPhone or iPad: Opely must be added to the Home Screen first) or "no"
function pushSupport() {
  const apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if ("serviceWorker" in navigator && "PushManager" in window && "Notification" in window && window.isSecureContext) return "yes";
  if (apple && !navigator.standalone) return "home-screen";
  return "no";
}
function keyBytes(text) {
  const plain = atob((text + "===".slice((text.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(plain, c => c.charCodeAt(0));
}
// Turns notifications on (or changes the stages): asks the browser, then tells the helper
async function subscribe(setup, topics) {
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error(t("Notifications are blocked. Allow them for Opely in the browser’s settings."));
  const registration = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let subscription = await registration.pushManager.getSubscription();
  if (!subscription) subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(setup.key) });
  const response = await fetch(setup.worker.replace(/\/+$/, "") + "/subscribe", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ subscription: subscription.toJSON(), topics: topics, lang: lang })
  });
  if (!response.ok) throw new Error(t("Couldn’t reach Opely’s notifications. Try again later."));
  setSavedNotify({ topics: topics, endpoint: subscription.endpoint, lang: lang });
}
async function unsubscribe(setup) {
  const saved = savedNotify();
  setSavedNotify(null);
  try {
    const registration = await navigator.serviceWorker.getRegistration();
    const subscription = registration && await registration.pushManager.getSubscription();
    if (subscription) await subscription.unsubscribe();
    const endpoint = (subscription && subscription.endpoint) || (saved && saved.endpoint);
    if (endpoint && setup) await fetch(setup.worker.replace(/\/+$/, "") + "/unsubscribe", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: endpoint }) });
  } catch (error) { /* turned off in this browser anyway */ }
}

async function showNotifications() {
  const view = viewNumber;
  document.title = t("Notifications") + " | Opely";
  app.innerHTML = `
    <a class="back" href="#settings">${t("Settings")}</a>
    <h1>${t("Notifications")}</h1>
    <p class="lead secondary">${t("Get a notification when a new lecture, lab or announcement is added to the stages you follow, even when Opely is closed.")}</p>
    <div id="notifyBody"><p class="secondary">${t("Loading…")}</p></div>`;
  const setup = await notifySetup();
  if (view !== viewNumber) return;
  const body = document.getElementById("notifyBody");
  const support = pushSupport();
  if (!setup) { body.innerHTML = emptyState("bell", "Notifications aren’t set up yet. The site’s owner turns them on from the admin page."); return; }
  if (support === "home-screen") {
    body.innerHTML = `<div class="card notify-help">${tile("bell", "red")}<p>${t("On iPhone and iPad, notifications work once Opely is on your Home Screen. Tap the Share button, then “Add to Home Screen”, and open Opely from there.")}</p></div>`;
    return;
  }
  if (support === "no") { body.innerHTML = emptyState("bell", "This browser can’t show notifications."); return; }

  const saved = savedNotify();
  const mine = myStage();
  let chosen = new Set(saved ? saved.topics : mine ? [mine.dept + "-" + mine.stage] : []);
  const stageList = dept => stagesOf(dept) || [1, 2, 3, 4].map(n => ({ id: "stage" + n, name: "Stage " + n }));
  const blocked = Notification.permission === "denied";
  body.innerHTML = `
    <ul class="group icons"><li><label class="row switch-row" for="notifyOn">${tile("bell", "red")}
      <span class="grow">${t("Notifications")}<br><span class="secondary small" id="notifyState">${t(saved ? "On" : "Off")}</span></span>
      <input id="notifyOn" type="checkbox" role="switch" ${saved ? "checked" : ""} ${blocked ? "disabled" : ""}><span class="switch" aria-hidden="true"></span>
    </label></li></ul>
    ${blocked ? `<p class="hint-below">${t("Notifications are blocked. Allow them for Opely in the browser’s settings.")}</p>` : ""}
    <h2 class="label">${t("Stages you follow")}</h2>
    ${departments.map(dept => `<div class="card notify-dept">
      <p class="notify-dept-name">${esc(localName(dept))}</p>
      <div class="chips">${stageList(dept).map(stage => { const topic = dept.id + "-" + stage.id;
        return `<button type="button" class="chip-toggle" data-topic="${esc(topic)}" aria-pressed="${chosen.has(topic)}">${esc(stageName(stage))}</button>`; }).join("")}</div>
    </div>`).join("")}
    <p class="hint-below" id="notifyMessage" role="status"></p>`;

  const toggle = document.getElementById("notifyOn");
  const message = document.getElementById("notifyMessage");
  const tell = (text, bad) => { message.textContent = text; message.classList.toggle("error-text", !!bad); };
  const busy = on => { toggle.disabled = on; app.querySelectorAll("[data-topic]").forEach(chip => { chip.disabled = on; }); };
  async function apply() {
    busy(true);
    try {
      if (toggle.checked) {
        if (!chosen.size) { toggle.checked = false; tell(t("Choose at least one stage first."), true); return; }
        tell(t("Saving…"));
        await subscribe(setup, Array.from(chosen));
        tell(t("You’ll get a notification when something new is added."));
      } else {
        await unsubscribe(setup);
        tell(t("Notifications are off."));
      }
      document.getElementById("notifyState").textContent = t(toggle.checked ? "On" : "Off");
    } catch (error) {
      toggle.checked = !!savedNotify();
      tell(error.message || String(error), true);
    } finally {
      busy(false);
      if (Notification.permission === "denied") toggle.disabled = true;
    }
  }
  toggle.addEventListener("change", apply);
  app.querySelectorAll("[data-topic]").forEach(chip => chip.addEventListener("click", () => {
    const topic = chip.dataset.topic;
    if (chosen.has(topic)) chosen.delete(topic); else chosen.add(topic);
    chip.setAttribute("aria-pressed", chosen.has(topic));
    if (toggle.checked) {
      if (!chosen.size) { toggle.checked = false; return apply(); } // no stages left: notifications turn off
      apply();
    }
  }));
}

    let bytes = 0;
    for (const request of saved) bytes += (await (await cache.match(request)).blob()).size;
    if (view !== viewNumber) return; // the student already moved to another page
    const big = bytes >= 1024 * 1024; // under 1 MB, the size is shown in KB
    const size = (bytes / (big ? 1024 * 1024 : 1024)).toLocaleString(locale, { maximumFractionDigits: big ? 1 : 0 }) + (big ? " MB" : " KB");
    const sizeLtr = "\u2066" + size + "\u2069"; // keeps "3 KB" in that order on an Arabic page
    sizeText.textContent = saved.length ? plural(saved.length, "file") + SEP + sizeLtr : t("None");
    document.getElementById("clearRow").hidden = saved.length === 0;
  } catch (error) {
    sizeText.textContent = t("Saving files isn’t available in this browser.");
  }

  // Removing them needs two taps: the first changes the button's text, the second removes
  clear.addEventListener("click", async () => {
    if (!clear.dataset.armed) {
      clear.dataset.armed = "yes";
      clear.textContent = t("Tap again to remove");
      setTimeout(() => {
        if (!clear.isConnected || !clear.dataset.armed) return;
        delete clear.dataset.armed;
        clear.textContent = t("Remove saved files");
      }, 4000);
      return;
    }
    await caches.delete(FILE_CACHE);
    showSettings();
  });
}
