    <span id="navMoves" class="nav-tools nav-moves" hidden>

    </span>

  <!-- Every page is drawn inside this element by the script below -->

<!-- The floating bar at the bottom: the student's next step (Continue, My stage), near the thumb -->
<nav id="dock" class="dock" hidden></nav>


<script>
/* =====================================================================
   STUDENT PAGE
   The look comes from style.css. The words come through lang.js: text
   wrapped in t("...") is shown in the language of the visitor's device.

   catalog.json lists the departments, grouped by university and faculty.
   Each department has its own content file, for example data/cs.json.
   The admin page (admin.html) updates those files. This page keeps
   copies in the browser so it opens instantly, then asks the site
   whether there are newer copies.
   ===================================================================== */
let faculties = [];      // every faculty in catalog.json, each with its departments
let departments = [];    // every department, as one flat list
let catalogText = null;  // the text of catalog.json being shown (null = not loaded yet)
const content = {};      // department id -> { text, stages, announcements }
let loadFailed = false;
const CACHE_PREFIX = "opely:";
const FILE_CACHE = "opely-files"; // where downloaded PDFs are kept in this browser
let viewNumber = 0;       // goes up each time a page is drawn, so slow work for an old page can stop
let fileUrl = null;       // the address of the PDF being viewed, for its Download button
let pageWatcher = null;   // notices which PDF pages are near the screen

const app = document.getElementById("app");
const VERSION = "1.0";
translatePage(); // the few words written in the HTML above
document.getElementById("navSettings").setAttribute("aria-label", t("Settings"));
document.getElementById("navSearch").setAttribute("aria-label", t("Search"));
document.getElementById("navHome").setAttribute("aria-label", t("Home"));
document.querySelectorAll("[data-theme-toggle]").forEach(button => button.setAttribute("aria-label", t("Light or dark")));

// Makes text safe to place inside HTML
function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Files stored in the repository download; outside links open in a new tab
function linkAttrs(url) {
  // Outside links and plain-text files open in a new tab; other files download
  return /^https?:/.test(url) || /\.txt$/i.test(url) ? 'target="_blank" rel="noopener"' : "download";
}

// A file stored in the site that Opely can show inside the page (PDF, text, code, notebook, picture).
// It is saved in the browser too. See viewer.js.
function isPdf(url) {
  return canView(url);
}

// One row in a list of files. `viewer` is the address of the in-page viewer for this file.
function fileRow(file, viewer) {
  const [shape, color] = fileKind(file.url);
  if (!file.url) {
    return `<li><span class="row">${tile(shape, "gray")}<span class="grow secondary">${esc(file.label)}</span><span class="end">${t("Not added yet")}</span></span></li>`;
  }
  if (isPdf(file.url)) {
    return `<li><a class="row" href="${viewer}" data-saved="${esc(file.url)}">${tile(shape, color)}<span class="grow">${esc(file.label)}</span><span class="end"></span></a></li>`;
  }
  return `<li><a class="row" href="${esc(file.from || file.url)}" ${linkAttrs(file.url)}>${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
}

// Writes “Saved” next to the files that are already stored in this browser
async function markSaved() {
  if (!window.caches) return;
  const cache = await caches.open(FILE_CACHE);
  document.querySelectorAll("[data-saved]").forEach(async row => {
    if (!(await cache.match(row.dataset.saved))) return;
    const label = row.querySelector(".end");
    label.className = "end saved";
    label.innerHTML = icon("check") + t("Saved");
  });
}

// Collects every lecture in the given stages, newest first
function allLectures(stageList) {
  const found = [];
  stageList.forEach(stage => stage.courses.forEach(course =>
    course.lectures.forEach((lecture, i) =>
      found.push({ stage, course, lecture, number: i + 1 }))));
  return found.sort((a, b) => b.lecture.date.localeCompare(a.lecture.date));
}

// The small arrow at the end of a widget
const chevron = () => icon("chevron", "flip chev");

// The wide widget that shows the newest lecture of a department
function latestWidget(dept, stageList) {
  const latest = allLectures(stageList)[0];
  if (!latest) return "";
  return `<a class="widget wide" href="#${dept.id}-${latest.stage.id}-${latest.course.id}-${latest.lecture.id || latest.number}">
    <span class="head"><span class="kicker">${t("Latest")}</span>${chevron()}</span>
    <span class="title">${esc(latest.lecture.title)}</span>
    <span class="meta-row"><span>${esc(latest.course.title)}</span><span>${niceDate(latest.lecture.date)}</span></span>
  </a>`;
}

// ----- Progress: which lectures the student has opened, kept in this browser only -----
const OPENED_KEY = "opely-opened";
let opened = {};
try { opened = JSON.parse(localStorage.getItem(OPENED_KEY)) || {}; } catch (error) { opened = {}; }
const keyOfLecture = (dept, stage, course, lecture, number) => `${dept.id}-${stage.id}-${course.id}-${lecture.id || number}`;
function markOpened(key) {
  opened[key] = Date.now();
  try { localStorage.setItem(OPENED_KEY, JSON.stringify(opened)); } catch (error) { /* storage blocked */ }
}
// How many lectures of a course, a stage, or a whole department have been opened: [opened, total]
function courseProgress(dept, stage, course) {
  const done = course.lectures.filter((lecture, i) => opened[keyOfLecture(dept, stage, course, lecture, i + 1)]).length;
  return [done, course.lectures.length];
}
function stageProgress(dept, stage) {
  return stage.courses.reduce(([d, n], course) => { const [a, b] = courseProgress(dept, stage, course); return [d + a, n + b]; }, [0, 0]);
}
function deptProgress(dept, stages) {
  return stages.reduce(([d, n], stage) => { const [a, b] = stageProgress(dept, stage); return [d + a, n + b]; }, [0, 0]);
}

// A progress ring, like the rings in Mo Focus. `size` is in pixels.
function ring(done, total, size, showText) {
  const part = total ? Math.round(done / total * 100) : 0;
  return `<span class="ring${part === 100 ? " full" : ""}" style="--size:${size}px" role="img" aria-label="${t("{done} of {total} opened", { done: done, total: total })}">
    <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15.9155"/>
      <circle class="bar" cx="18" cy="18" r="15.9155" stroke-dasharray="${part} 100"/></svg>
    ${showText ? `<span class="ring-text" dir="ltr"><b>${done}</b><small>/${total}</small></span>` : ""}
  </span>`;
}
// A thin progress bar
const progressBar = (done, total) => `<span class="progress"><span style="width:${total ? done / total * 100 : 0}%"></span></span>`;

// The last lecture the student opened, kept in this browser only
const LAST_KEY = "opely-last";
function rememberLecture(address, lecture, course, number, courseKey) {
  try {
    localStorage.setItem(LAST_KEY, JSON.stringify({ address: address, title: lecture.title, course: course.title,
      number: number, courseKey: courseKey, total: course.lectures.length, lab: !!course.isLabs }));
  } catch (error) { /* storage blocked */ }
}
function continueWidget() {
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_KEY)); } catch (error) { last = null; }
  if (!last || !last.address) return `<div class="hero static welcome">
    <span class="hero-text">
      <span class="kicker">${t("Welcome")}</span>
      <span class="hero-title">${t("Every lecture, in one place.")}</span>
      <span class="sub">${t("Pick your department to start. Opely remembers where you stopped.")}</span>
    </span>
    <img src="icon.svg" alt="" class="app-icon welcome-icon">
  </div>`;
  const done = Object.keys(opened).filter(key => last.courseKey && key.startsWith(last.courseKey + "-") &&
    (last.lab || !key.startsWith(last.courseKey + "-labs-"))).length; // a course's lab keys are counted with its labs only
  return `<a class="hero" href="${esc(last.address)}">
    <span class="hero-text">
      <span class="kicker">${t("Continue")}</span>
      <span class="hero-title">${esc(last.title)}</span>
      <span class="sub">${esc(last.course)}${last.number ? SEP + t(last.lab ? "Lab {n}" : "Lecture {n}", { n: last.number }) : ""}</span>
      <span class="glow-button">${t("Open")}</span>
    </span>
    ${last.total ? ring(Math.min(done, last.total), last.total, 96, true) : ""}
  </a>`;
}

// The home page's small card under the departments, near the thumb: where the student stopped, and their stage.
// A new student sees a welcome row that picks their stage.
function quickCard() {
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_KEY)); } catch (error) { last = null; }
  const mine = myStage();
  const mineDept = mine && departments.find(d => d.id === mine.dept);
  const rows = [];
  if (last && last.address) {
    rows.push(`<li><a class="row quick-row" href="${esc(last.address)}">${tile("play", "indigo")}
      <span class="grow"><span class="quick-kicker">${t("Continue")}</span>${esc(last.title)}<br>
        <span class="secondary small">${esc(last.course)}${last.number ? SEP + t(last.lab ? "Lab {n}" : "Lecture {n}", { n: last.number }) : ""}</span></span></a></li>`);
  }
  if (mineDept) {
    const stages = stagesOf(mineDept);
    const stage = stages && stages.find(s => s.id === mine.stage);
    const name = stage ? stageName(stage) : t("Stage {n}", { n: mine.stage.replace("stage", "") });
    const next = content[mineDept.id] && upcomingEvents(mineDept, mine.stage)[0];
    rows.push(`<li><a class="row quick-row" href="#${mineDept.id}-${mine.stage}">${tile(mineDept.icon || "school", mineDept.color)}
      <span class="grow"><span class="quick-kicker">${t("My stage")}</span>${esc(name)}${SEP}${esc(localName(mineDept))}<br>
        <span class="secondary small">${next ? `${esc(next.title)}${SEP}${timeUntil(next.event).words}` : stage ? plural(stage.courses.length, "course") : ""}</span></span></a></li>`);
  }
  if (!rows.length) { // a new student: a welcome that picks their stage, then becomes the My stage row
    rows.push(`<li><a class="row quick-row" href="#" id="pickStage" role="button">${tile("school", "teal")}
      <span class="grow"><span class="quick-kicker">${t("Welcome to Opely")}</span>${t("Pick your stage")}<br>
        <span class="secondary small">${t("It stays here, one tap away.")}</span></span></a></li>`);
  }
  return `<ul class="group icons quick-card">${rows.join("")}</ul>`;
}

// ----- The floating bar at the bottom: the page's next step, near the thumb -----
// Each page puts one or two buttons in it with setDock(); the main one is blue.
// An item: { href | attrs | id, main, round, icon, tile, kicker, name, label, end, pressed }
function dockItem(item) {
  // Icons only. What a button does is in its label: read by screen readers, and shown in a small
  // bubble when the button is pressed and held (see the dock's listeners below).
  const words = item.label || [item.kicker, item.name].filter(Boolean).join(": ");
  const shape = item.end === "chevron" || item.end === "skip" ? icon(item.end, "flip") : (item.icon ? icon(item.icon, item.flip ? "flip" : "") : "");
  const cls = "dock-button dock-round" + (item.main ? " dock-main" : "") + (item.here ? " is-here" : "");
  const inside = shape + (item.badge ? `<span class="dock-badge">${item.badge}</span>` : "");
  const label = ` aria-label="${esc(words)}" data-tip="${esc(words)}"`;
  const hidden = item.hidden ? " hidden" : "";
  if (item.id && !item.attrs) return `<button class="${cls}" type="button" id="${item.id}"${label}${hidden}${item.pressed !== undefined ? ` aria-pressed="${item.pressed}"` : ""}>${inside}</button>`;
  return `<a class="${cls}"${item.id ? ` id="${item.id}"` : ""} ${item.attrs || `href="${esc(item.href)}"`}${label}${hidden}>${inside}</a>`;
}
// A bubble that stays over a bar button while something happens (saving, downloading), then fades
function statusTip(button) {
  let bubble = null, timer = null;
  return (text, done) => {
    if (!button.isConnected) return;
    if (!bubble || !bubble.isConnected) bubble = showTip(button, text, true); else bubble.textContent = text;
    clearTimeout(timer);
    if (done) timer = setTimeout(() => { if (bubble) bubble.remove(); bubble = null; }, 2200);
  };
}
// A small bubble above a bar button. Gone by itself after a moment, unless `kept` (then the caller removes it).
function showTip(button, text, kept) {
  const bubble = document.createElement("div");
  bubble.className = "dock-tip"; bubble.textContent = text;
  document.body.append(bubble);
  const box = button.getBoundingClientRect(), width = bubble.offsetWidth;
  bubble.style.left = Math.min(innerWidth - width - 12, Math.max(12, box.left + box.width / 2 - width / 2)) + "px";
  bubble.style.top = (box.top - bubble.offsetHeight - 10) + "px";
  if (!kept) setTimeout(() => bubble.remove(), 1600);
  return bubble;
}
// Press and hold a bar button: a bubble above it says what it does (the tap that ends the hold does nothing)
(() => {
  const dock = document.getElementById("dock");
  let timer = null, held = false, bubble = null;
  const hide = () => { if (bubble) { bubble.remove(); bubble = null; } };
  dock.addEventListener("pointerdown", event => {
    const button = event.target.closest(".dock-button");
    if (!button) return;
    held = false; clearTimeout(timer);
    timer = setTimeout(() => {
      held = true; hide();
      bubble = showTip(button, button.dataset.tip || "", true);
      if (navigator.vibrate) navigator.vibrate(8);
    }, 420);
  });
  const end = () => { clearTimeout(timer); setTimeout(hide, held ? 1400 : 0); };
  dock.addEventListener("pointerup", end);
  dock.addEventListener("pointercancel", end);
  dock.addEventListener("pointerleave", end);
  dock.addEventListener("contextmenu", event => event.preventDefault()); // no copy-link menu on a long press
  dock.addEventListener("click", event => { if (held) { event.preventDefault(); event.stopImmediatePropagation(); held = false; } }, true);
})();
let dockSet = false;    // whether the page being drawn filled the bar
let dockBack = "#home"; // where Back goes (the top bar's button, and the swipe from the edge)
function setDock(items) {
  const dock = document.getElementById("dock");
  items = (items || []).filter(Boolean);
  dockSet = true;
  // It only rises in when it appears; moving between pages that both have it, it just stays
  dock.classList.toggle("dock-still", !dock.hidden && items.length > 0);
  dock.innerHTML = items.map(dockItem).join("");
  dock.hidden = !items.length;
  document.body.classList.toggle("has-dock", !dock.hidden);
}

// Continue: the lecture where the student stopped
function continueItem(main) {
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_KEY)); } catch (error) { last = null; }
  if (!last || !last.address) return null;
  return { href: last.address, main: main, icon: "play", name: last.title, label: t("Continue") + ": " + last.title }; // the play icon says "continue"
}
// My stage: short when it shares the bar, with the department's name when alone
function myStageItem(alone, round) {
  const mine = myStage();
  const mineDept = mine && departments.find(d => d.id === mine.dept);
  if (!mineDept) return null;
  const stages = stagesOf(mineDept);
  const stage = stages && stages.find(s => s.id === mine.stage);
  const name = stage ? stageName(stage) : t("Stage {n}", { n: mine.stage.replace("stage", "") });
  return { href: "#" + mineDept.id + "-" + mine.stage, main: alone, round: round && !alone, icon: "school", // a plain icon, like Continue and Announcements
    kicker: alone ? t("My stage") : "", name: alone ? name + SEP + localName(mineDept) : name,
    label: t("My stage") + ": " + name + SEP + localName(mineDept) };
}
// Announcements in the bar: a megaphone, with how many are new
function newsItem(dept, notes, stageId) {
  if (!notes.length) return null;
  const unread = notes.filter(item => newIn(dept).has(newsKey(item))).length;
  return { href: "#" + dept.id + "-news" + (stageId ? "-" + stageId : ""), round: true, icon: "megaphone", badge: unread,
    label: t("Announcements") + (unread ? SEP + t("{n} new", { n: unread }) : "") };
}

// The home page and a department: Continue and My stage, or the welcome that picks a stage
function nextStepDock(here, extra) {
  const go = continueItem(true);
  const mine = myStageItem(!go, false);
  if (mine && here) mine.here = true; // on My stage itself: its icon turns green
  if (!go && !mine) {
    setDock([{ id: "pickStage", main: true, icon: "school", kicker: t("Welcome to Opely"), name: t("Pick your stage") }, extra]);
    document.getElementById("pickStage").addEventListener("click", () => pickMyStage());
    return;
  }
  setDock([go, mine, extra]);
}
// Next (a lecture, or a file): the blue button. Back, in the top bar, goes up to the page above.
function pagerDock(before, after, extra) {
  setDock([after ? Object.assign({ main: true, end: "chevron" }, after) : null].concat(extra || [])); // after.end may say "skip" (»)
}

// The welcome row: the student picks their department, then their stage, from two short lists
async function pickMyStage() {
  const dept = departments.length === 1 ? departments[0]
    : await chooseFrom(t("Your department"), departments.map(d => ({ label: localName(d), value: d })));
  if (!dept) return;
  let stages = stagesOf(dept);
  if (!stages) {
    try { await refreshFile(dept.data, null, text => useDepartment(dept.id, text)); stages = content[dept.id].stages; } catch (error) { stages = null; }
  }
  if (!stages || !stages.length) { location.hash = "#" + dept.id; return; } // offline: open the department instead
  const stage = stages.length === 1 ? stages[0]
    : await chooseFrom(t("Your stage"), stages.map(s => ({ label: stageName(s), value: s })));
  if (!stage) return;
  setMyStage({ dept: dept.id, stage: stage.id });
  route(true);
}

// A list of choices that rises from the bottom of the screen, like an iPhone action sheet.
// Resolves with the chosen value, or null.
function chooseFrom(title, choices) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    backdrop.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}">
      <p class="sheet-title">${esc(title)}</p>
      <div class="group">${choices.map((choice, i) => `<button type="button" class="row sheet-option" data-i="${i}">
        <span class="grow">${esc(choice.label)}</span></button>`).join("")}</div>
      <button type="button" class="sheet-cancel">${t("Cancel")}</button>
    </div>`;
    const close = value => { backdrop.classList.add("closing"); setTimeout(() => backdrop.remove(), 250); resolve(value); };
    backdrop.addEventListener("click", event => { if (event.target === backdrop) close(null); });
    backdrop.querySelector(".sheet-cancel").addEventListener("click", () => close(null));
    backdrop.querySelectorAll(".sheet-option").forEach(button =>
      button.addEventListener("click", () => close(choices[Number(button.dataset.i)].value)));
    document.body.append(backdrop);
    backdrop.querySelector(".sheet-option, .sheet-cancel").focus();
  });
}

// The number of lectures in a department, from the copy saved in this browser (null if not saved yet)
function savedProgress(dept) {
  if (content[dept.id]) return deptProgress(dept, content[dept.id].stages);
  try {
    const text = savedCopy(dept.data);
    if (text) return deptProgress(dept, JSON.parse(text).stages || []);
  } catch (error) { /* ignored */ }
  return null;
}

// ----- My stage: the student's own department and stage, kept in this browser -----
const MY_STAGE_KEY = "opely-my-stage";
function myStage() {
  try { return JSON.parse(localStorage.getItem(MY_STAGE_KEY)); } catch (error) { return null; }
}
function setMyStage(value) {
  try { value ? localStorage.setItem(MY_STAGE_KEY, JSON.stringify(value)) : localStorage.removeItem(MY_STAGE_KEY); } catch (error) { /* storage blocked */ }
}
// The department's stages: shown, or from the copy saved in this browser
function stagesOf(dept) {
  if (content[dept.id]) return content[dept.id].stages;
  try { const text = savedCopy(dept.data); if (text) return JSON.parse(text).stages || []; } catch (error) { /* ignored */ }
  return null;
}
// The "My stage" card on the home page
function myStageWidget() {

// ----- "New" badges: lectures, labs and announcements added since the student last looked -----
// Opely remembers, in this browser, what it has already shown. The first visit to a department
// shows nothing as new; after that, anything added is new until the student sees it.
const KNOWN_KEY = "opely-known";
function knownStore() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY)) || {}; } catch (error) { return {}; } }
function saveKnown(store) { try { localStorage.setItem(KNOWN_KEY, JSON.stringify(store)); } catch (error) { /* storage full */ } }
const newsKey = item => "news:" + (item.id || item.title + item.date);
// Every key of a department: its lectures, labs and announcements
function itemKeys(dept) {
  const stages = stagesOf(dept);
  if (!stages) return null;
  const keys = [];
  stages.forEach(stage => stage.courses.forEach(course => {
    course.lectures.forEach((lecture, i) => keys.push(keyOfLecture(dept, stage, course, lecture, i + 1)));
    if (hasLabs(course)) { const labs = asLabs(course); labs.lectures.forEach((lab, i) => keys.push(keyOfLecture(dept, stage, labs, lab, i + 1))); }
  }));
  const news = content[dept.id] ? content[dept.id].announcements : [];
  news.forEach(item => keys.push(newsKey(item)));
  return keys;
}
// The keys that are new in a department (an empty set on the first visit)
function newIn(dept) {
  const keys = itemKeys(dept);
  if (!keys) return new Set();
  const store = knownStore();
  if (!store[dept.id]) { store[dept.id] = keys; saveKnown(store); return new Set(); }
  const known = new Set(store[dept.id]);
  return new Set(keys.filter(key => !known.has(key)));
}
function markKnown(dept, keys) {
  if (!keys.length) return;
  const store = knownStore();
  const known = new Set(store[dept.id] || []);
  keys.forEach(key => known.add(key));
  store[dept.id] = [...known];
  saveKnown(store);
}
const newBadge = count => count ? `<span class="new-badge">${count === true ? t("New") : t("{n} new", { n: count })}</span>` : "";
// How many new lectures and labs a course (or a stage) has
function newCount(dept, stage, course, fresh) {
  let n = course.lectures.filter((lecture, i) => fresh.has(keyOfLecture(dept, stage, course, lecture, i + 1))).length;
  if (hasLabs(course)) { const labs = asLabs(course); n += labs.lectures.filter((lab, i) => fresh.has(keyOfLecture(dept, stage, labs, lab, i + 1))).length; }
  return n;
}

// ----- Share a course or a lecture: the phone's share sheet, or the link is copied -----
// Share, as a bar button (the phone's share sheet, or the link is copied)
const shareItem = () => ({ id: "shareButton", icon: "upload", label: t("Share") });
function shareButton() {
  return `<button id="shareButton" class="mine-pill share-pill" type="button">${icon("upload")}${t("Share")}</button>`;
}
function wireShare(title) {
  const button = document.getElementById("shareButton");
  if (!button) return;
  button.addEventListener("click", async () => {
    const link = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: title, url: link }); } catch (error) { /* closed */ }
      return;
    }
    const copied = typeof copyText === "function" && await copyText(link);
    if (button.closest(".dock")) return showTip(button, t(copied ? "Link copied" : "Can’t copy here")); // an icon: say it in a bubble
    button.lastChild.textContent = t(copied ? "Link copied" : "Can’t copy here");
    setTimeout(() => { if (button.isConnected) button.lastChild.textContent = t("Share"); }, 2000);
  });
}

// ----- The archive: earlier versions of a course, and lectures, labs and sources that were removed -----
// Archived files are no longer on the site; they are read from the site's history on GitHub
// ("commit" says which saved version still has them). They take no space on the site.
function historyAddress(file) {
  if (!file.commit || !location.hostname.endsWith(".github.io")) return file.url; // on a computer, the file is still in the folder
  const owner = location.hostname.replace(".github.io", "");
  const repo = location.pathname.split("/").filter(Boolean)[0] || "Opely";
  return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + file.commit + "/" + file.url.split("/").map(encodeURIComponent).join("/");
}
// A whole course that was archived (stage.archivedCourses), ready to show like any course.
// Its files are read from the history: each gets "from", the address to read it from.
function archivedCourse(stage, id) {
  const found = (stage.archivedCourses || []).find(course => course.id === id);
  if (!found) return null;
  const from = file => file.commit && file.url ? Object.assign({}, file, { from: historyAddress(file) }) : file;
  const item = lecture => Object.assign({}, lecture, { files: (lecture.files || []).map(from) });
  return Object.assign({}, found, { isArchived: true, lectures: found.lectures.map(item),
    labs: found.labs ? found.labs.map(item) : found.labs, sources: (found.sources || []).map(from) });
}

function showArchivedCourses(dept, stage) {

  document.title = t("Archived courses") + " | " + stageName(stage);

    <h1>${t("Archived courses")}</h1>
    ${widgets ? `<div class="courses">${widgets}</div>` : emptyState("clock", "No archived courses.")}`;
}
const hasArchive = course => !!course.archive && ((course.archive.versions || []).length + (course.archive.removed || []).length) > 0;
// A row of an archived file: opens in Opely when it can, otherwise downloads from the history
function archivedFileRow(file, viewer) {
  const [shape, color] = fileKind(file.url);
  if (/^https?:/.test(file.url)) return `<li><a class="row" href="${esc(file.url)}" target="_blank" rel="noopener">${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
  return isPdf(file.url)
    ? `<li><a class="row" href="${viewer}">${tile(shape, color)}<span class="grow">${esc(file.label)}${file.removedAt ? `<br><span class="secondary small">${t("Removed {date}", { date: niceDate(file.removedAt) })}</span>` : ""}</span></a></li>`
    : `<li><a class="row" href="${esc(historyAddress(file))}" download>${tile(shape, color)}<span class="grow">${esc(file.label)}</span></a></li>`;
}
function archiveRowFor(dept, stage, course) {
  if (!hasArchive(course)) return "";
  const a = course.archive;
  const parts = [(a.versions || []).length ? plural(a.versions.length, "earlier version") : "", (a.removed || []).length ? plural(a.removed.length, "removed item") : ""].filter(Boolean).join(SEP);
  // A quiet grey line at the end of the list: the archive is extra, not another lecture
  return `<a class="archive-link" href="#${dept.id}-${stage.id}-${course.id}-archive">${icon("clock")}<span>${t("Archive")} · ${parts}</span>${icon("chevron", "flip")}</a>`;
}
// The archive page of a course
function showArchive(dept, stage, course) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const a = course.archive || { versions: [], removed: [] };

      <span class="sub">${[plural(version.lectures.length, "lecture"), version.labs.length ? plural(version.labs.length, "lab") : "", version.sources.length ? plural(version.sources.length, "source") : ""].filter(Boolean).join(SEP)}</span>
    </a>`).join("");
  const kinds = { lecture: ["doc", "indigo", "Lecture"], lab: ["flask", "green", "Lab"], source: ["book", "gray", "Source"] };
  const removed = (a.removed || []).map(entry => {

    ${removed ? `<h2 class="label">${t("Removed")}</h2><ul class="group icons">${removed}</ul>` : ""}
    ${!versions && !removed ? emptyState("clock", "Nothing in the archive yet.") : ""}`;
}
// An archived version: its lectures, labs and sources, the way the course looked then
function showArchivedVersion(dept, stage, course, version) {

// An archived lecture or lab, read only
function showArchivedItem(dept, stage, course, item, back, here, word) {
  document.title = item.title + " | " + course.code;
  const files = (item.files || []).map((file, i) => archivedFileRow(file, here + "-" + (i + 1))).join("");
  app.innerHTML = `

    </div>
    ${item.video ? `<h2 class="label">${t("Recording")}</h2><ul class="group icons"><li><a class="row" href="${esc(item.video)}" target="_blank" rel="noopener">${tile("play", "pink")}<span class="grow">${t("Watch recording")}</span></a></li></ul>` : ""}
    ${item.summary ? `<h2 class="label">${t("Summary")}</h2><p class="text-block">${esc(item.summary)}</p>` : ""}
    ${files ? `<ul class="group icons lecture-list">${files}</ul>` : `<p class="text-block secondary">${t("No files yet.")}</p>`}
    ${(item.earlier || []).length ? `<h2 class="label">${t("Earlier files")}</h2><ul class="group icons earlier">${item.earlier.map((file, i) => archivedFileRow(file, here + "-earlier-" + (i + 1))).join("")}</ul>` : ""}`;
}
// Opens an archived file inside Opely, read from the history
function showArchivedFile(file, back, backLabel) {
  return showFile(Object.assign({}, file, { from: historyAddress(file) }), back, backLabel);
}
// #cs-stage1-cs101-archive ...  -<version id>  -<version id>-<lecture id>[-<n>]  -<version id>-sources-<n>
//                                -<removed id>[-<n>]
function openArchive(dept, stage, course, parts) {
  const base = "#" + dept.id + "-" + stage.id + "-" + course.id;
  const a = course.archive || { versions: [], removed: [] };
  const [key, second, third] = parts;
  if (key === undefined) return showArchive(dept, stage, course);
  const version = (a.versions || []).find(v => v.id === key);
  if (version) {
    const vbase = base + "-archive-" + version.id;
    if (second === undefined) return showArchivedVersion(dept, stage, course, version);
    if (second === "sources") { const source = version.sources[Number(third) - 1]; return source ? showArchivedFile(source, vbase, version.name) : showNotFound(); }
    const items = version.lectures.concat(version.labs);
    const item = items.find(other => other.id === second) || version.lectures[Number(second) - 1];
    if (!item) return showNotFound();
    const word = version.labs.includes(item) ? "Lab" : "Lecture";
    if (third === undefined) return showArchivedItem(dept, stage, course, item, vbase, vbase + "-" + second, word);
    if (third === "earlier") { const earlier = (item.earlier || [])[Number(parts[3]) - 1]; return earlier ? showArchivedFile(earlier, vbase + "-" + second, item.title) : showNotFound(); }
    const file = (item.files || [])[Number(third) - 1];
    return file ? showArchivedFile(file, vbase + "-" + second, item.title) : showNotFound();
  }
  const entry = (a.removed || []).find(r => r.id === key);
  if (!entry) return showNotFound();
  if (entry.kind === "source") return showArchivedFile(entry.item, base + "-archive", t("Archive"));
  const here = base + "-archive-" + entry.id;
  if (second === undefined) return showArchivedItem(dept, stage, course, entry.item, base + "-archive", here, entry.kind === "lab" ? "Lab" : "Lecture");
  if (second === "earlier") { const earlier = (entry.item.earlier || [])[Number(third) - 1]; return earlier ? showArchivedFile(earlier, here, entry.item.title) : showNotFound(); }
  const file = (entry.item.files || [])[Number(second) - 1];
  return file ? showArchivedFile(file, here, entry.item.title) : showNotFound();
}

// ----- Search: every course, lecture, lab, file and announcement, in every department -----
let searchFrom = "#home";  // where the student was before opening Search
let newsFrom = "";         // where the student was before opening the announcements
let lastQuery = "";        // kept, so going back to Search shows the same results
// Lower case, without Arabic marks, with the letters that are often typed differently made the same
function plain(text) {
  return String(text || "").toLowerCase()
    .replace(/[ً-ْٰـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}
// Everything that can be found, from the departments shown or saved in this browser
function searchIndex() {
  const found = [];
  departments.forEach(dept => {
    const stages = stagesOf(dept);
    if (!stages) return;
    stages.forEach(stage => stage.courses.forEach(course => {
      const courseHref = `#${dept.id}-${stage.id}-${course.id}`;
      const where = stageName(stage) + SEP + localName(dept);
      found.push({ kind: "course", title: course.title, sub: course.code + SEP + where, href: courseHref, text: [course.title, course.code, course.instructor].join(" ") });
      const lists = [[course, "lecture"]].concat(hasLabs(course) ? [[asLabs(course), "lab"]] : []);
      lists.forEach(([list, kind]) => list.lectures.forEach((lecture, i) => {
        const here = `#${dept.id}-${stage.id}-${list.id}-${lecture.id || i + 1}`;
        const label = t(kind === "lab" ? "Lab {n}" : "Lecture {n}", { n: i + 1 }) + SEP + course.code + SEP + (dept.short || localName(dept));
        found.push({ kind: kind, title: lecture.title, sub: label, href: here, text: [lecture.title, lecture.summary].join(" ") });
        (lecture.files || []).forEach((file, f) => {
          if (!file.url) return;
          found.push({ kind: "file", title: file.label, sub: label, href: isPdf(file.url) ? here + "-" + (f + 1) : here, url: file.url, text: file.label });
        });
      }));
      (course.sources || []).forEach((source, f) => {
        found.push({ kind: "file", title: source.label, sub: t("Source") + SEP + course.code + SEP + (dept.short || localName(dept)), href: isPdf(source.url) ? courseHref + "-sources-" + (f + 1) : courseHref + "-sources", url: source.url, text: source.label });
      });
    }));
    const news = content[dept.id] ? content[dept.id].announcements : (() => { try { return JSON.parse(savedCopy(dept.data)).announcements || []; } catch (error) { return []; } })();
    news.filter(item => !hasEnded(item)).forEach(item => found.push({ kind: "news", title: item.title, sub: niceDate(item.date) + SEP + localName(dept), href: `#${dept.id}-news`, text: [item.title, item.text].join(" ") }));
  });
  return found;
}
// Marks the words that were searched for
function markWords(text, words) {
  let html = esc(text);
  words.forEach(word => {
    if (!word) return;
    const at = plain(text).indexOf(word);
    if (at === -1 || plain(text).length !== text.length) return; // only when letters line up one to one
    const original = text.slice(at, at + word.length);
    html = html.replace(esc(original), "<mark>" + esc(original) + "</mark>");
  });
  return html;
}
function searchResults(query) {
  const words = plain(query).split(/\s+/).filter(Boolean);
  if (!words.length) return `<p class="hint-below">${t("Search every course, lecture, lab, file and announcement.")}</p>`;
  const groups = { course: [], lecture: [], lab: [], file: [], news: [] };
  searchIndex().forEach(item => {
    const text = plain(item.text);
    if (!words.every(word => text.includes(word))) return;
    const score = plain(item.title).startsWith(words[0]) ? 0 : 1;
    groups[item.kind].push(Object.assign({ score: score }, item));
  });
  const titles = { course: "Courses", lecture: "Lectures", lab: "Labs", file: "Files", news: "Announcements" };
  const shapes = { course: ["book", "blue"], lecture: ["doc", "indigo"], lab: ["flask", "green"], news: ["megaphone", "orange"] };
  const sections = Object.keys(groups).filter(kind => groups[kind].length).map(kind => {
    const rows = groups[kind].sort((a, b) => a.score - b.score).slice(0, 25).map(item => {
      const [shape, color] = kind === "file" ? fileKind(item.url) : shapes[kind];
      return `<li><a class="row" href="${item.href}">${tile(shape, color)}<span class="grow">${markWords(item.title, words)}<br><span class="secondary small">${esc(item.sub)}</span></span></a></li>`;
    }).join("");
    return `<h2 class="label">${t(titles[kind])}</h2><ul class="group icons">${rows}</ul>`;
  }).join("");
  return sections || emptyState("search", "Nothing found. Try other words.");
}
async function showSearch() {
  document.title = t("Search") + " | Opely";
  app.innerHTML = `
    <a class="back" href="${searchFrom}">${t("Back")}</a>
    <h1>${t("Search")}</h1>
    <label class="search-field">${icon("search")}<input id="searchInput" type="search" enterkeyhint="search" autocomplete="off"
      placeholder="${t("Courses, lectures, labs, files")}" value="${esc(lastQuery)}" aria-label="${t("Search")}"></label>
    <div id="searchResults">${searchResults(lastQuery)}</div>`;
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  input.addEventListener("input", () => { lastQuery = input.value; results.innerHTML = searchResults(lastQuery); });
  if (!lastQuery) setTimeout(() => input.focus(), 350);
  // Get every department, so the search covers all of them; the results update when they arrive
  const view = viewNumber;
  await Promise.allSettled(departments.map(dept => refreshFile(dept.data, content[dept.id] ? content[dept.id].text : null, text => useDepartment(dept.id, text))));
  if (view === viewNumber && document.getElementById("searchResults")) results.innerHTML = searchResults(lastQuery);
}

// ----- Save a whole course for offline: every file of its lectures, labs and sources -----
function courseFiles(course) {
  const files = [];
  course.lectures.concat(course.labs || []).forEach(lecture => (lecture.files || []).forEach(file => files.push(file)));
  (course.sources || []).forEach(source => files.push(source));
  return files.filter(file => file.url && !/^https?:/.test(file.url));
}
async function offlineCount(files) {
  if (!window.caches) return 0;
  const cache = await caches.open(FILE_CACHE);
  let saved = 0;
  for (const file of files) if (await cache.match(file.url)) saved += 1;
  return saved;
}
function offlineRow(course) {
  if (!window.caches || !courseFiles(course).length) return "";
  return `<ul class="group icons offline-row"><li><button id="offlineButton" class="row" type="button">
    <span id="offlineTile">${tile("download", "blue")}</span>
    <span class="grow">${t("Save for offline")}<br><span id="offlineState" class="secondary small">${t("Checking…")}</span></span>
  </button></li></ul>`;
}
async function wireOffline(course) {
  const button = document.getElementById("offlineButton");
  if (!button) return;
  const files = courseFiles(course);
  const say = statusTip(button);
  let note = "";
  const state = { get textContent() { return note; }, set textContent(text) { note = text; if (button.dataset.busy || button.dataset.armed || started) say(text, !button.dataset.busy); } };
  let started = false;
  const show = saved => {
    const all = saved === files.length;
    note = all ? t("All {n} files are saved in this browser.", { n: files.length }) : t("{saved} of {n} files saved", { saved: saved, n: files.length });
    button.innerHTML = icon(all ? "check" : "tray");
    button.classList.toggle("is-saved", all);
    const words = t("Save the course in this browser") + SEP + note;
    button.setAttribute("aria-label", words); button.dataset.tip = words;
    button.dataset.all = all ? "yes" : "";
  };
  show(await offlineCount(files));
  button.addEventListener("click", async () => {
    if (button.dataset.busy) return;
    started = true;
    if (button.dataset.all) { // already saved: a second tap removes the copies
      if (!button.dataset.armed) { button.dataset.armed = "yes"; state.textContent = t("Tap again to remove this course’s saved files."); setTimeout(() => { delete button.dataset.armed; }, 4000); return; }
      delete button.dataset.armed;
      const cache = await caches.open(FILE_CACHE);
      for (const file of files) await cache.delete(file.url);
      show(0); markSaved();
      return;
    }
    button.dataset.busy = "yes";
    let saved = 0, failed = 0;
    for (const file of files) {
      state.textContent = t("Saving {i} of {n}…", { i: saved + failed + 1, n: files.length });
      try { await getFile(file.url); saved += 1; } catch (error) { failed += 1; }
    }
    delete button.dataset.busy;
    show(await offlineCount(files));
    say(note + (failed ? SEP + t("{n} couldn’t be saved. Check your connection.", { n: failed }) : ""), true);
    markSaved();
  });
}

// Today, as "2026-11-15"
function todayText() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

// Whether an announcement's "remove after" time has passed. A date alone lasts the whole day.
function hasEnded(item) {
  if (!item.until) return false;
  return item.until.length <= 10 ? item.until < todayText() : new Date(item.until) < new Date();
}
// "Nov 20, 2026" or "Nov 20, 2026, 09:00"
function whenText(value) {
  const [day, time] = value.split("T");
  return niceDate(day) + (time ? SEP + new Date(value).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" }) : "");
}

// ----- Countdowns: exams and events from announcements -----
// The upcoming events for a stage (or a whole department), soonest first
function upcomingEvents(dept, stageId) {
  const now = new Date();
  return announcementsFor(dept, stageId)
    .filter(item => item.event && (item.event.length <= 10 ? item.event >= todayText() : new Date(item.event) > now))
    .sort((a, b) => new Date(a.event.length <= 10 ? a.event + "T00:00" : a.event) - new Date(b.event.length <= 10 ? b.event + "T00:00" : b.event)); // the nearest first
}
// How long until an event: { number, unit } for the big text, and a short sentence
function timeUntil(event) {
  const [day, time] = event.split("T");
  const start = new Date(day + "T00:00");
  const today = new Date(todayText() + "T00:00");
  const days = Math.round((start - today) / 86400000);
  if (days < 0) return { number: "", unit: t("Done"), words: t("Already happened") };
  if (days === 0) {
    if (time) {
      const hours = Math.max(0, Math.round((new Date(event) - new Date()) / 3600000));
      if (hours >= 1) return { number: hours, unit: hours === 1 ? t("hour") : t("hours"), words: t("Today at {time}", { time: new Date(event).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" }) }) };
      return { number: "", unit: t("Starting soon"), words: t("Starting soon") };
    }
    return { number: "", unit: t("Today"), words: t("Today") };
  }
  if (days === 1) return { number: 1, unit: t("day"), words: t("Tomorrow") };
  return { number: days, unit: t("days"), words: t("In {n} days", { n: days }) };
}
// The countdown card: the next event, big, with the others below it
// A stage's next exams and deadlines, as a card like Statistics: the next two, each with the days left
// (orange when it is a week away or less). Information only: the 📣 button in the bar opens the announcements.
function comingUpCard(dept, stageId) {
  const events = upcomingEvents(dept, stageId).slice(0, 2);
  if (!events.length) return "";
  const today = new Date(todayText() + "T00:00");
  const rows = events.map(item => {
    const days = Math.round((new Date(item.event.split("T")[0] + "T00:00") - today) / 86400000);
    const left = timeUntil(item.event);
    return `<li class="up-row">
      <span class="up-days${days <= 7 ? " soon" : ""}"><b>${left.number}</b><small>${esc(left.unit)}</small></span>
      <span class="up-text"><span class="up-title">${esc(item.title)}</span><span class="up-when">${whenText(item.event)}</span></span>
    </li>`;
  }).join("");
  return `<section class="stats-card up-card tinted orange" aria-label="${t("Coming up")}">
    <span class="kicker">${t("Coming up")}</span>
    <ul class="up-list">${rows}</ul>
  </section>`;
}

// ----- Announcements -----
// Newest first. With a stage id, only that stage's own announcements.
function announcementsFor(dept, stageId) {
  return content[dept.id].announcements
    .filter(news => !hasEnded(news)) // past its "remove after" time: no longer shown
    .filter(news => stageId === undefined || news.stage === "all" || news.stage === stageId || (news.stages || []).includes(stageId))
    .sort((a, b) => b.date.localeCompare(a.date));
}

// ----- Colour, after Apple's system colours: each department, stage and course keeps its own -----
// Content colours only: orange, red and green are kept for what they mean (soon, new or danger, done)
const PALETTE = ["blue", "indigo", "purple", "teal", "pink", "cyan", "mint", "brown"];
const stageColor = (stage, i) => stage.color || PALETTE[i % PALETTE.length];
// A course's colour: from its place in its stage (by code), the same on every page
function courseColor(stage, course) {
  if (course.color) return course.color;
  const sorted = stage.courses.slice().sort((a, b) => a.code.localeCompare(b.code, "en", { numeric: true }));
  const place = Math.max(0, sorted.findIndex(c => c.id === course.id.replace(/-labs$/, "")));
  return PALETTE[place % PALETTE.length];
}

// Numbers as a card (information, not a button): a big total, a line of other counts,
// and a small bar chart. bars: [{ name, words, n }]
function numbersCard(total, more, chartLabel, bars, tint) {
  const most = Math.max(1, ...bars.map(bar => bar.n));
  const columns = bars.map(bar => `<span class="stat-bar ${esc(bar.color || "")}" title="${esc(bar.words)}" aria-label="${esc(bar.words)}" role="img">
      <span class="stat-value">${bar.n}</span>
      <span class="stat-fill" style="height:${bar.n ? Math.max(6, Math.round(bar.n / most * 100)) : 0}%"></span>
      <span class="stat-name">${esc(bar.name)}</span></span>`).join("");
  return `<section class="stats-card${tint ? " tinted " + esc(tint) : ""}" aria-label="${t("Statistics")}">
    <div class="stats-head">
      <span class="kicker">${t("Statistics")}</span>
      <span class="stats-total"><b>${total}</b> ${t(total === 1 ? "lecture" : "lectures")}</span>
      <span class="stats-more">${more}</span>
    </div>
    <div class="stats-chart">
      <span class="stats-chart-label">${t(chartLabel)}</span>
      <div class="stat-bars">${columns}</div>
    </div>
  </section>`;
}
// A department in numbers, with its lectures by stage
function statsCard(dept, stages) {
  const courses = stages.reduce((n, stage) => n + stage.courses.length, 0);
  const labs = stages.reduce((n, stage) => n + stage.courses.reduce((m, course) => m + (course.labs || []).length, 0), 0);
  const bars = stages.map((stage, i) => {
    const n = allLectures([stage]).length;
    return { name: String(i + 1), words: stageName(stage) + ": " + plural(n, "lecture"), n: n, color: stageColor(stage, i) };
  });
  return numbersCard(bars.reduce((a, b) => a + b.n, 0),
    plural(courses, "course") + SEP + plural(stages.length, "stage") + (labs ? SEP + plural(labs, "lab") : ""),
    "Lectures by stage", bars, dept.color);
}
// Every department in numbers, with its lectures by department (from the copies saved in this browser)
function homeStatsCard() {
  let courses = 0, labs = 0;
  const bars = departments.map(dept => {
    const stages = stagesOf(dept) || [];
    courses += stages.reduce((n, stage) => n + stage.courses.length, 0);
    labs += stages.reduce((n, stage) => n + stage.courses.reduce((m, course) => m + (course.labs || []).length, 0), 0);

    return { name: dept.short || localName(dept), words: localName(dept) + ": " + plural(n, "lecture"), n: n, color: dept.color };
  });
  return numbersCard(bars.reduce((a, b) => a + b.n, 0),
    plural(departments.length, "department") + SEP + plural(courses, "course") + (labs ? SEP + plural(labs, "lab") : ""),

}
// The home page's numbers need every department's file: the ones not saved in this browser yet are
// fetched once, quietly, and the page is drawn again
const fetchedForHome = new Set();
function fetchDepartmentsForHome() {
  const missing = departments.filter(dept => !stagesOf(dept) && !fetchedForHome.has(dept.id));
  if (!missing.length) return;
  missing.forEach(dept => fetchedForHome.add(dept.id));
  Promise.allSettled(missing.map(dept => refreshFile(dept.data, null, text => useDepartment(dept.id, text))))
    .then(() => { if (!shownName || shownName === "home") route(true); });
}

// The semester a stage opens on: the one with the newest lecture or lab, so it moves to
// Semester 2 by itself when teachers start adding to it
const SEMESTER_KEY = "opely-semester"; // "auto", "1" or "2" (Settings → My stage)
const savedSemester = () => { try { return localStorage.getItem(SEMESTER_KEY) || "auto"; } catch (error) { return "auto"; } };
function currentSemester(stage) {
  if (savedSemester() === "1" || savedSemester() === "2") return Number(savedSemester());
  let newest = "", semester = 1;
  stage.courses.forEach(course => (course.lectures || []).concat(course.labs || []).forEach(lecture => {
    if ((lecture.date || "") > newest) { newest = lecture.date; semester = course.semester === 2 ? 2 : 1; }
  }));
  return semester;
}

      <span class="head"><span class="kicker" dir="ltr">${esc(course.code)}</span><span class="head-end">${newBadge(newCount(dept, stage, course, fresh))}${chevron()}</span></span>

  // The bar: Continue, and the switch that makes this stage My stage

// The bar's button on a course: the first lecture not opened yet
function nextItem(dept, stage, course) {
  const index = course.lectures.findIndex((lecture, i) => !opened[keyOfLecture(dept, stage, course, lecture, i + 1)]);
  if (index === -1) return null;
  const lecture = course.lectures[index];
  const words = course.isLabs ? (index === 0 ? "Start with Lab {n}" : "Continue with Lab {n}") : (index === 0 ? "Start with Lecture {n}" : "Continue with Lecture {n}");
  return { attrs: lectureLink(dept, stage, course, lecture, index + 1), main: true, icon: "play", kicker: t(words, { n: index + 1 }), name: lecture.title };
}

// The note on a course's main card when everything is opened (the next lecture is in the bar)
function nextButton(dept, stage, course, base, noteOnly) {
  const index = course.lectures.findIndex((lecture, i) => !opened[keyOfLecture(dept, stage, course, lecture, i + 1)]);
  if (course.lectures.length === 0) return "";
  if (index === -1) return `<span class="sub done-note">${icon("check")}${t(course.isLabs ? "All labs opened" : "All lectures opened")}</span>`;
  if (noteOnly) return "";
  const lecture = course.lectures[index];
  const words = course.isLabs ? (index === 0 ? "Start with Lab {n}" : "Continue with Lab {n}") : (index === 0 ? "Start with Lecture {n}" : "Continue with Lecture {n}");
  return `<a class="glow-button" ${lectureLink(dept, stage, course, lecture, index + 1)}>${t(words, { n: index + 1 })}</a>`;
}

// A course's labs, shaped like its lectures, so labs use the same pages, links and progress.
// Their addresses add "-labs": #cs-stage1-cs101-labs, #cs-stage1-cs101-labs-<lab id>
function asLabs(course) {
  return Object.assign({}, course, { id: course.id + "-labs", lectures: course.labs || [], isLabs: true });
}
const hasLabs = course => !!course.hasLabs || (course.labs || []).length > 0;

// A lecture with just one file, and no recording or summary, opens that file straight away
function directFile(lecture) {
  const files = lecture.files || [];
  return files.length === 1 && files[0].url && !lecture.video && !lecture.summary ? files[0] : null;
}
// Where tapping a lecture goes: its page, or its only file
function lectureLink(dept, stage, course, lecture, number) {
  const here = "#" + dept.id + "-" + stage.id + "-" + course.id + "-" + (lecture.id || number);
  const file = directFile(lecture);
  if (!file) return `href="${here}"`;
  if (isPdf(file.url)) return `href="${here}-1"`;
  return `href="${esc(file.from || file.url)}" ${linkAttrs(file.url)} data-opens="${esc(keyOfLecture(dept, stage, course, lecture, number))}"`;
}
// A file that opens outside the page still counts as opening its lecture
document.addEventListener("click", event => {
  const link = event.target.closest && event.target.closest("[data-opens]");
  if (link) markOpened(link.dataset.opens);
});

    <nav class="segments${hasLabs(course) ? " three" : ""}" aria-label="${t("Course content")}">

  // The bar, the same on Lectures, Labs and Sources: the next lecture, the whole course to your files (a zip)

  const whole = courseFiles(course).length ? [

// A lecture's recording, as a row of its list: a pink play tile, and the site it is on
function videoRow(url) {
  let host = "";
  try { host = new URL(url).hostname.replace(/^www\.|^m\./, ""); } catch (error) { host = ""; }
  const site = /youtu/.test(host) ? "YouTube" : /drive\.google/.test(host) ? "Google Drive" : /vimeo/.test(host) ? "Vimeo" : host;
  return `<li><a class="row" href="${esc(url)}" target="_blank" rel="noopener">${tile("play", "pink")}
    <span class="grow">${t("Recording")}</span><span class="end video-site">${esc(site)}${icon("external")}</span></a></li>`;
}

// ----- Save offline: every file of a lecture kept in this browser (like a course's "Save for offline") -----
async function wireKeepOffline(lecture) {
  const button = document.getElementById("keepOffline");
  if (!button) return;
  const files = zipFiles(lecture);
  const address = file => file.from || file.url;
  const say = statusTip(button);
  const label = { set textContent(text) { say(text); } }; // what the button would have said, in a bubble
  const state = { set textContent(text) { say(text, true); } };
  const view = viewNumber;
  const count = async () => {
    try { const cache = await caches.open(FILE_CACHE); let n = 0; for (const file of files) if (await cache.match(address(file))) n += 1; return n; } catch (error) { return 0; }
  };
  const show = saved => {
    const all = saved === files.length;
    button.dataset.all = all ? "yes" : "";
    button.classList.toggle("is-saved", all);
    button.innerHTML = icon(all ? "check" : "tray");
    const words = t(all ? "Saved in this browser" : "Save in this browser");
    button.setAttribute("aria-label", words); button.dataset.tip = words;
  };
  show(await count());
  button.addEventListener("click", async () => {
    if (button.dataset.busy) return;
    if (button.dataset.all) { // already saved: a second tap removes the copies
      if (!button.dataset.armed) { button.dataset.armed = "yes"; say(t("Tap again to remove"), true); setTimeout(() => { if (button.isConnected && button.dataset.armed) { delete button.dataset.armed; show(files.length); } }, 4000); return; }
      delete button.dataset.armed;
      const cache = await caches.open(FILE_CACHE);
      for (const file of files) await cache.delete(address(file));
      show(0); markSaved();
      state.textContent = t("Removed from this browser.");
      return;
    }
    button.dataset.busy = "yes";
    let saved = 0, failed = 0;
    for (const file of files) {
      label.textContent = t("Saving {i} of {n}…", { i: saved + failed + 1, n: files.length });
      try { await getFile(address(file)); saved += 1; } catch (error) { failed += 1; }
    }
    delete button.dataset.busy;
    if (view !== viewNumber) return;
    show(await count());
    state.textContent = failed ? t("{n} couldn’t be saved. Check your connection.", { n: failed }) : t("Saved in this browser. It opens even without internet.");
    markSaved();
  });
}

// ----- Download all: every file of a lecture in one zip -----
// Files kept on the site go in; web links (Drive and so on) can't, so they are left out.
const zipFiles = lecture => (lecture.files || []).filter(file => file.url && !/^https?:/.test(file.url));
let zipLibrary = null;
function loadZipLibrary() {
  if (!zipLibrary) zipLibrary = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "lib/jszip.min.js";
    script.onload = () => resolve(window.JSZip);
    script.onerror = () => { zipLibrary = null; reject(new Error("zip")); };
    document.head.append(script);
  });
  return zipLibrary;
}
// Files on the device: one file as itself, several as one zip. `say` shows how it is going.
async function downloadToDevice(files, name, say) {
  const clean = text => text.replace(/[\\/:*?"<>|]/g, "-");
  try {
    let blob, filename;
    if (files.length === 1) {
      say(t("Getting file {i} of {n}…", { i: 1, n: 1 }));
      blob = (await getFile(files[0].from || files[0].url)).blob;
      filename = clean(downloadName(files[0]));
    } else {
      const JSZip = await loadZipLibrary();
      const zip = new JSZip();
      const used = new Set();
      for (let i = 0; i < files.length; i += 1) {
        say(t("Getting file {i} of {n}…", { i: i + 1, n: files.length }));
        const got = await getFile(files[i].from || files[i].url);
        let entry = clean(downloadName(files[i]));
        if (used.has(entry.toLowerCase())) entry = (i + 1) + " " + entry;
        used.add(entry.toLowerCase());
        zip.file(entry, got.blob);
      }
      say(t("Making the zip…"));
      blob = await zip.generateAsync({ type: "blob" });
      filename = clean(name) + ".zip";
    }
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
    say(t("Downloaded."), true);
  } catch (error) {
    say(t("Couldn’t download everything. Check your connection, then try again."), true);
  }
}

// A ⬇ button at the end of every lecture, lab and source of a course: download it to your files, or
// keep it in this browser. Once it is kept, the button is a green tick (tap it to remove it).
function wireRowSaves(course, shown, section) {
  const list = app.querySelector(".course-list");
  if (!list) return;
  const items = section === "sources"
    ? (course.sources || []).map(source => ({ title: source.label, files: [source], name: source.label }))
    : shown.lectures.map(lecture => ({ title: lecture.title, files: lecture.files || [], name: course.code + " – " + lecture.title }));
  const address = file => file.from || file.url;
  [...list.children].forEach(async (row, i) => {
    const item = items[i];
    const files = item ? item.files.filter(file => file.url && !/^https?:/.test(address(file))) : [];
    if (!files.length) return;
    const button = document.createElement("button");
    button.type = "button"; button.className = "row-save";
    button.setAttribute("aria-label", t("Download or save") + ": " + item.title);
    button.innerHTML = icon("download");
    row.classList.add("has-save"); row.append(button);
    const isSaved = async () => {
      if (!window.caches) return false;
      try { const cache = await caches.open(FILE_CACHE); for (const file of files) if (!(await cache.match(address(file)))) return false; return true; } catch (error) { return false; }
    };
    const show = async () => { const all = await isSaved(); button.classList.toggle("is-saved", all); button.innerHTML = icon(all ? "check" : "download"); return all; };
    await show();
    button.addEventListener("click", async () => {
      const saved = button.classList.contains("is-saved");
      const choice = await chooseFrom(item.title, [
        { label: t("Download to your files"), value: "download" },
        window.caches ? (saved ? { label: t("Remove from this browser"), value: "remove" } : { label: t("Save in this browser"), value: "save" }) : null
      ].filter(Boolean));
      if (!choice) return;
      const say = statusTip(button);
      if (choice === "download") { await downloadToDevice(files, item.name, say); await show(); markSaved(); return; }
      if (choice === "remove") {
        const cache = await caches.open(FILE_CACHE);
        for (const file of files) await cache.delete(address(file));
        await show(); markSaved();
        return say(t("Removed from this browser."), true);
      }
      let failed = 0;
      for (let k = 0; k < files.length; k += 1) {
        say(t("Saving {i} of {n}…", { i: k + 1, n: files.length }));
        try { await getFile(address(files[k])); } catch (error) { failed += 1; }
      }
      await show(); markSaved();
      say(failed ? t("{n} couldn’t be saved. Check your connection.", { n: failed }) : t("Saved in this browser"), true);
    });
  });
}

// The whole course as one zip on the device: a folder for each lecture and lab, and one for the sources
function wireDownloadCourse(course) {
  const button = document.getElementById("downloadCourse");
  if (!button) return;
  const say = statusTip(button);
  const clean = name => name.replace(/[\\/:*?"<>|]/g, "-");
  button.addEventListener("click", async () => {
    if (button.disabled) return;
    const parts = [];
    course.lectures.forEach((lecture, i) => (lecture.files || []).forEach(file => parts.push([clean(t("Lecture {n}", { n: i + 1 }) + " – " + lecture.title), file])));
    (course.labs || []).forEach((lab, i) => (lab.files || []).forEach(file => parts.push([clean(t("Lab {n}", { n: i + 1 }) + " – " + lab.title), file])));
    (course.sources || []).forEach(file => parts.push([clean(t("Sources")), file]));
    const files = parts.filter(([, file]) => file.url && !/^https?:/.test(file.from || file.url));
    if (!files.length) return;
    button.disabled = true;
    try {
      const JSZip = await loadZipLibrary();
      const zip = new JSZip();
      const used = new Set();
      for (let i = 0; i < files.length; i += 1) {
        say(t("Getting file {i} of {n}…", { i: i + 1, n: files.length }));
        const [folder, file] = files[i];
        const got = await getFile(file.from || file.url);
        let name = folder + "/" + clean(downloadName(file));
        if (used.has(name.toLowerCase())) name = folder + "/" + (i + 1) + " " + clean(downloadName(file));
        used.add(name.toLowerCase());
        zip.file(name, got.blob);
      }
      say(t("Making the zip…"));
      const blob = await zip.generateAsync({ type: "blob" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = clean(course.code + " – " + course.title) + ".zip";
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 60000);
      say(t("Downloaded."), true); markSaved();
    } catch (error) {
      say(t("Couldn’t download everything. Check your connection, then try again."), true);
    } finally {
      button.disabled = false;
    }
  });
}

function wireDownloadAll(lecture, course) {
  const button = document.getElementById("downloadAll");
  if (!button) return;
  const say = statusTip(button);
  const state = { set textContent(text) { say(text, /^(Downloaded|Couldn|تم|تعذ)/.test(text) || text === t("Downloaded.")); } };
  const view = viewNumber;
  button.addEventListener("click", async () => {
    const files = zipFiles(lecture);
    button.disabled = true;
    try {
      const JSZip = await loadZipLibrary();
      const zip = new JSZip();
      const used = new Set();
      for (let i = 0; i < files.length; i += 1) {
        state.textContent = t("Getting file {i} of {n}…", { i: i + 1, n: files.length });
        const got = await getFile(files[i].from || files[i].url);
        let name = downloadName(files[i]).replace(/[\\/:*?"<>|]/g, "-");
        if (used.has(name.toLowerCase())) { const dot = name.lastIndexOf("."); name = (dot > 0 ? name.slice(0, dot) : name) + " (" + (i + 1) + ")" + (dot > 0 ? name.slice(dot) : ""); }
        used.add(name.toLowerCase());
        zip.file(name, got.blob);
      }
      state.textContent = t("Making the zip…");
      const blob = await zip.generateAsync({ type: "blob" }); // stored as they are: PDFs and slides are already packed
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = (course.code + " – " + lecture.title).replace(/[\\/:*?"<>|]/g, "-") + ".zip";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 60000);
      if (view === viewNumber) { state.textContent = t("Downloaded."); markSaved(); }
    } catch (error) {
      if (view === viewNumber) state.textContent = t("Couldn’t download everything. Check your connection, then try again.");
    } finally {
      button.disabled = false;
    }
  });
}

// ----- A PDF, shown inside the page -----
// Gets a file: from this browser if it was saved before, otherwise from the
// site, and then it is saved for next time. Returns { blob, saved }.
async function getFile(url) {
  let cache = null;
  try { if (window.caches) cache = await caches.open(FILE_CACHE); } catch (error) { cache = null; }
  if (cache) {
    const saved = await cache.match(url);
    if (saved) return { blob: await saved.blob(), saved: true };
  }
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);
  let saved = false;
  if (cache) {
    try { await cache.put(url, response.clone()); saved = true; } catch (error) { /* storage full */ }
  }
  return { blob: await response.blob(), saved: saved };
}

// Loads the PDF reader (PDF.js, in the lib folder) the first time it is needed
let pdfLibrary = null;
function loadPdfLibrary() {
  if (!pdfLibrary) {
    pdfLibrary = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "lib/pdf.min.js";
      script.onload = () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
        resolve(pdfjsLib);
      };
      script.onerror = () => { pdfLibrary = null; reject(new Error("The PDF reader didn’t load.")); };
      document.head.append(script);
    });
  }
  return pdfLibrary;
}

// The name a downloaded file gets: its label, with the file's own ending
function downloadName(file) {
  const ending = (file.url.split(".").pop() || "").toLowerCase();
  return ending && !file.label.toLowerCase().endsWith("." + ending) ? file.label + "." + ending : file.label;
}

async function showFile(file, backAddress, backLabel, pager) {

  app.innerHTML = `
    <a class="back" href="${backAddress}">${esc(backLabel)}</a>
    <h1>${esc(file.label)}</h1>
    <p id="fileStatus" class="secondary" role="status">${t("Downloading…")}</p>
    <div id="pages" class="pages"></div>
    <div id="shown" class="shown"></div>
    ${pager ? pager.count : ""}`;
  // The bar: Next file (›) and Next lecture (»), both (after the last file, Next lecture is the blue one),
  // then the file's own buttons, each shown once it can be used: download, open in the device's viewer, copy
  const moves = !pager ? [] : pager.after
    ? [Object.assign({ main: true, end: "chevron" }, pager.after), pager.following]
    : [pager.following && Object.assign({ main: true }, pager.following)];
  setDock(moves.concat([
    { id: "fileDownload", attrs: `href="#"`, icon: "download", label: t("Download"), hidden: true },
    { id: "fileOpen", attrs: `href="${esc(file.from || file.url)}" target="_blank" rel="noopener"`, icon: "external", label: t("Open in your device’s viewer"), hidden: true },
    { id: "fileCopy", icon: "copy", label: t("Copy"), hidden: true }]));
  const status = document.getElementById("fileStatus");
  const type = fileType(file.url) || { kind: "pdf", name: "PDF" };

  try {
    // 1. Get the file and offer it as a download
    const got = await getFile(file.from || file.url);
    if (view !== viewNumber) return; // the student already moved to another page
    fileUrl = URL.createObjectURL(got.blob);
    const download = document.getElementById("fileDownload");
    download.href = fileUrl;
    download.download = downloadName(file);
    download.hidden = false;

    // 2. Text, code, notebooks and pictures are shown by viewer.js
    status.textContent = t("Opening…");
    if (type.kind !== "pdf") {
      const shown = await showInPage(document.getElementById("shown"), got.blob, type, file.label);
      if (view !== viewNumber) return;
      status.hidden = true; // the file speaks for itself: no line about its kind or size
      if (shown.text !== null) {
        const copy = document.getElementById("fileCopy");
        copy.hidden = false;
        copy.addEventListener("click", async () => {
          showTip(copy, t(await copyText(shown.text) ? "Copied" : "Can’t copy here")); // an icon: say it in a bubble
        });
      }
      return;
    }

    // 3. A PDF: show its pages
    const library = await loadPdfLibrary();
    const pdf = await library.getDocument({ data: await got.blob.arrayBuffer() }).promise;
    if (view !== viewNumber) return;
    status.hidden = true; // no "4 pages" line: the pages are right there
    document.getElementById("fileOpen").hidden = false;
    await showPages(pdf, view);
  } catch (error) {
    if (view !== viewNumber) return;
    status.hidden = false;
    status.textContent = fileUrl
      ? t("Can’t show this file here. You can still download it.")
      : t("Can’t get this file. Check your connection, then reload.");
  }
}

// Makes an empty box for every page, and draws a page only when the student
// scrolls near it. A long file would be slow and heavy if drawn all at once.
// Settings → Reading → PDF pages: "fit" makes each page as wide as the screen, "actual" shows it at its
// real size (a page of A4 is about 794 pixels wide), scrolling sideways when it is wider than the screen.
const ACTUAL = 96 / 72; // PDF sizes are in points; the screen counts in pixels
async function showPages(pdf, view) {
  const holder = document.getElementById("pages");
  const size = (await pdf.getPage(1)).getViewport({ scale: 1 });
  if (view !== viewNumber) return;
  const actual = readerSettings().pdf === "actual";
  holder.classList.toggle("actual", actual);

  pageWatcher = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    pageWatcher.unobserve(entry.target);
    drawPage(pdf, entry.target, view);
  }), { rootMargin: "800px 0px" });

  // While scrolling, a small "3 / 12" floats under the top bar, then fades away
  if (pdf.numPages > 1) {
    const badge = document.createElement("div");
    badge.className = "page-badge"; badge.setAttribute("aria-hidden", "true");
    document.body.append(badge);
    let fade = null;
    const update = () => {
      if (view !== viewNumber || !holder.isConnected) { removeEventListener("scroll", update); badge.remove(); return; }
      const middle = innerHeight / 2;
      const current = [...holder.children].find(box => box.getBoundingClientRect().bottom > middle);
      if (!current) return;
      badge.textContent = current.dataset.page + " / " + pdf.numPages;
      badge.classList.add("show");
      clearTimeout(fade); fade = setTimeout(() => badge.classList.remove("show"), 1200);
    };
    addEventListener("scroll", update, { passive: true });
  }

  for (let number = 1; number <= pdf.numPages; number += 1) {
    const box = document.createElement("div");
    box.className = "page";
    box.dataset.page = number;
    box.style.aspectRatio = size.width + " / " + size.height;
    if (actual) box.style.width = Math.round(size.width * ACTUAL) + "px";
    holder.append(box);
    pageWatcher.observe(box);
  }
}

async function drawPage(pdf, box, view) {
  const page = await pdf.getPage(Number(box.dataset.page));
  if (view !== viewNumber) return;
  // Draw at the width of the box, a little sharper on high-resolution screens
  const sharpness = Math.min(window.devicePixelRatio || 1, 3);
  const natural = page.getViewport({ scale: 1 });
  if (box.parentElement.classList.contains("actual")) box.style.width = Math.round(natural.width * ACTUAL) + "px";
  const scale = box.clientWidth / natural.width; // the page's size on the screen
  const viewport = page.getViewport({ scale: scale * sharpness });
  const canvas = document.createElement("canvas");
  canvas.dir = "ltr"; // a PDF page is drawn left to right, even on a right-to-left site
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", t("Page {n}", { n: box.dataset.page }));
  box.style.aspectRatio = natural.width + " / " + natural.height;
  box.append(canvas);
  const drawing = page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;

  // The page's text, laid invisibly over the picture of it, so it can be selected, copied, looked up
  // or translated with the phone's own menu. A scanned page (only a picture) has no text to lay.
  try {
    const layer = document.createElement("div");
    layer.className = "textLayer";
    layer.style.setProperty("--scale-factor", scale);
    box.append(layer);
    const text = await page.getTextContent();
    if (view !== viewNumber) return;
    await pdfjsLib.renderTextLayer({ textContentSource: text, container: layer, viewport: page.getViewport({ scale: scale }), textDivs: [] }).promise;
  } catch (error) { /* the page is still shown, only without selectable text */ }
  await drawing;
  box.classList.add("drawn");
}
